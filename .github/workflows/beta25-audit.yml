name: Beta25 Isolated Engineering Audit
on:
  push:
    branches: [audit/beta25-20260921-engineering]
    paths: [.github/workflows/beta25-audit.yml]
permissions:
  contents: read
jobs:
  targeted-validation:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 53dff85de5b4277f37783fdb3f3f1b4506e028f9
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Prepare pinned production source
        shell: pwsh
        run: |
          New-Item audit-output -ItemType Directory -Force | Out-Null
          git rev-parse HEAD | Set-Content audit-output/audited-commit.txt
          dotnet --info | Set-Content audit-output/dotnet-info.txt
          ./scripts/Generate-BrandAssets.ps1 -Verify
          ./scripts/Generate-BrandAssets.ps1
          dotnet restore DropSpace.sln -p:Configuration=Release -p:RestoreLockedMode=true *> audit-output/restore.log
          $code = $LASTEXITCODE
          Get-Content audit-output/restore.log
          "restore=$code" | Set-Content audit-output/exit-codes.txt
          exit $code
      - name: Corrected Debug solution build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build DropSpace.sln -c Debug --no-restore -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false *> audit-output/build-debug.log
          $code = $LASTEXITCODE
          Get-Content audit-output/build-debug.log
          "debug=$code" | Add-Content audit-output/exit-codes.txt
          exit $code
      - name: Corrected Release solution build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build DropSpace.sln -c Release --no-restore -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false *> audit-output/build-release.log
          $code = $LASTEXITCODE
          Get-Content audit-output/build-release.log
          "release=$code" | Add-Content audit-output/exit-codes.txt
          exit $code
      - name: Add audit-only contract tests to ephemeral runner
        shell: pwsh
        run: |
          @'
          using System.IO.Compression;
          using DropSpace.Core.Models;
          using DropSpace.Core.Policies;
          using DropSpace.Core.Preview;
          using DropSpace.Infrastructure.Actions;
          using DropSpace.Infrastructure.Content;
          using DropSpace.Infrastructure.Data;
          using DropSpace.Infrastructure.Preview;
          using DropSpace.Infrastructure.Storage;
          using Microsoft.Data.Sqlite;
          using Microsoft.Extensions.Logging.Abstractions;
          namespace DropSpace.Infrastructure.Tests;
          [TestClass]
          public sealed class Beta25AuditRegressionTests
          {
              private string _root = null!;
              private AppStoragePaths _paths = null!;
              private SqliteDatabase _database = null!;
              private SqliteItemRepository _repository = null!;
              private readonly LocalFileReferenceService _references = new();
              public TestContext TestContext { get; set; } = null!;
              [TestInitialize]
              public void Initialize()
              {
                  _root = Path.Combine(Path.GetTempPath(), "DropSpace-Beta25-Audit", Guid.NewGuid().ToString("N"));
                  _paths = new AppStoragePaths(_root);
                  _paths.EnsureCreated();
                  _database = new SqliteDatabase(_paths, NullLogger<SqliteDatabase>.Instance);
                  _repository = new SqliteItemRepository(_database, NullLogger<SqliteItemRepository>.Instance);
              }
              [TestCleanup]
              public void Cleanup()
              {
                  SqliteConnection.ClearAllPools();
                  if (!Directory.Exists(_root)) return;
                  foreach (var file in Directory.EnumerateFiles(_root, "*", SearchOption.AllDirectories)) File.SetAttributes(file, FileAttributes.Normal);
                  Directory.Delete(_root, true);
              }
              private async Task<DropItemSnapshot> SnapshotAsync(string path) => DropItemSnapshot.FromItem(await _repository.AddFileAsync(await _references.InspectAsync(path)));
              [TestMethod]
              public async Task Zip_PreservesNestedRelativePaths()
              {
                  var folder = Path.Combine(_root, "Project");
                  Directory.CreateDirectory(Path.Combine(folder, "src"));
                  await File.WriteAllTextAsync(Path.Combine(folder, "src", "main.txt"), "payload");
                  var result = await new ZipActionService(_paths).ExecuteAsync(new(new([await SnapshotAsync(folder)])));
                  Assert.IsTrue(result.Succeeded);
                  using var zip = ZipFile.OpenRead(result.OutputPaths.Single());
                  var names = zip.Entries.Select(e => e.FullName).ToArray();
                  TestContext.WriteLine("Actual entries: " + string.Join(", ", names));
                  CollectionAssert.Contains(names, "Project/src/main.txt", "ZIP must preserve relative directory structure.");
              }
              [TestMethod]
              public async Task Zip_PreservesEmptyDirectory()
              {
                  var folder = Path.Combine(_root, "EmptyFolder");
                  Directory.CreateDirectory(folder);
                  var result = await new ZipActionService(_paths).ExecuteAsync(new(new([await SnapshotAsync(folder)])));
                  Assert.IsTrue(result.Succeeded);
                  using var zip = ZipFile.OpenRead(result.OutputPaths.Single());
                  TestContext.WriteLine("Actual entry count: " + zip.Entries.Count);
                  Assert.IsTrue(zip.Entries.Any(e => e.FullName.EndsWith("EmptyFolder/", StringComparison.Ordinal)), "Successful folder archive must retain an empty selected folder.");
              }
              [TestMethod]
              public async Task Relink_ClipboardReferenceBecomesAvailable()
              {
                  var missing = await _references.InspectAsync(Path.Combine(_root, "missing.txt"));
                  var item = await _repository.AddClipboardFileAsync(missing, Guid.NewGuid().ToString("N"), null);
                  var replacementPath = Path.Combine(_root, "replacement.txt");
                  await File.WriteAllTextAsync(replacementPath, "replacement");
                  await _repository.ReplaceFileReferenceAsync(item.Id, await _references.InspectAsync(replacementPath));
                  var actual = await _repository.GetAsync(item.Id);
                  Assert.IsNotNull(actual);
                  TestContext.WriteLine($"status={actual.Status}; title={actual.Title}; path={actual.File?.OriginalPath}");
                  Assert.AreEqual(ItemStatus.Available, actual.Status, "Relink must update the parent row as well as file_references.");
                  Assert.AreEqual("replacement.txt", actual.Title);
              }
              [TestMethod]
              public async Task Relink_OwnedFileUsesReplacementAcrossContentConsumers()
              {
                  var payloads = new FilePayloadStore(_paths);
                  using var input = new MemoryStream("owned"u8.ToArray());
                  var payload = await payloads.WriteFileAsync("files", ".txt", input, 1024);
                  var ownedPath = payloads.ResolvePath(payload.RelativePath);
                  var item = await _repository.AddOwnedSpaceFileAsync(await _references.InspectAsync(ownedPath), payload, null);
                  File.Delete(ownedPath);
                  await _repository.UpdateFileStatusAsync(item.Id, ItemStatus.Missing, "deleted");
                  var replacement = Path.Combine(_root, "replacement.txt");
                  await File.WriteAllTextAsync(replacement, "replacement");
                  await _repository.ReplaceFileReferenceAsync(item.Id, await _references.InspectAsync(replacement));
                  var actual = await _repository.GetAsync(item.Id);
                  Assert.IsNotNull(actual);
                  var resolved = new ItemContentResolver(_paths).Resolve(DropItemSnapshot.FromItem(actual));
                  TestContext.WriteLine($"file={actual.File?.OriginalPath}; payload={actual.Payload?.RelativePath}; readable={resolved.HasReadablePath}; resolved={resolved.ReadablePath}");
                  Assert.IsTrue(resolved.HasReadablePath, "A successful relink must not remain bound to a missing old owned payload.");
              }
              [TestMethod]
              [DataRow("😀a")]
              [DataRow("😀😃")]
              public async Task Search_TwoUnicodeScalarsFindExistingSubstring(string query)
              {
                  await _repository.AddSpaceTextAsync(ContentClassifier.CreateTextCandidate("prefix " + query + " suffix"));
                  var control = await _repository.QueryAsync(new ItemQuery(Search: "prefix"));
                  Assert.AreEqual(1, control.Count, "Control: the inserted item and FTS index must exist.");
                  var actual = await _repository.QueryAsync(new ItemQuery(Search: query));
                  TestContext.WriteLine($"query={query}; utf16Length={query.Length}; actualCount={actual.Count}");
                  Assert.AreEqual(1, actual.Count, "FTS trigram eligibility must count Unicode scalars, not UTF-16 code units.");
              }
              [TestMethod]
              public async Task SeparateDrops_DeduplicateUnicodeCaseOfSameWindowsFile()
              {
                  var upper = Path.Combine(_root, "Ä.txt");
                  var lower = Path.Combine(_root, "ä.txt");
                  await File.WriteAllTextAsync(upper, "same physical file");
                  Assert.IsTrue(File.Exists(lower), "Fixture requires default case-insensitive Windows filesystem.");
                  var first = await _repository.AddFileAsync(await _references.InspectAsync(upper));
                  var second = await _repository.AddFileAsync(await _references.InspectAsync(lower));
                  TestContext.WriteLine($"first={first.Id}; second={second.Id}; count={await _repository.CountAsync(ItemSource.Space)}");
                  Assert.AreEqual(first.Id, second.Id, "The repository must match the Unicode case-insensitive identity used by intake.");
              }
              [TestMethod]
              public async Task Pdf_GrowthBelowSafetyLimitDoesNotFailAtStaleImportedSize()
              {
                  var path = Path.Combine(_root, "document.pdf");
                  var original = "%PDF-1.4\n% audit provider fixture\n%%EOF\n";
                  await File.WriteAllTextAsync(path, original, new System.Text.UTF8Encoding(false));
                  var snapshot = await SnapshotAsync(path);
                  var provider = new PdfPreviewProvider(new ItemContentResolver(_paths));
                  Assert.IsTrue((await provider.LoadAsync(new(snapshot))).HasBytes, "Control: initial bytes load.");
                  await File.AppendAllTextAsync(path, new string(' ', 200));
                  TestContext.WriteLine($"known={snapshot.KnownSize}; current={new FileInfo(path).Length}");
                  var current = await provider.LoadAsync(new(snapshot));
                  Assert.AreEqual(new FileInfo(path).Length, (long)current.Bytes!.Length, "Bound against a fixed safety ceiling, not stale KnownSize.");
              }
              [TestMethod]
              public async Task Cleanup_FailedOldestBatchDoesNotStarveLaterDeletablePayload()
              {
                  await _repository.InitializeAsync();
                  await using (var connection = await _database.OpenConnectionAsync())
                  await using (var transaction = await connection.BeginTransactionAsync())
                  {
                      for (var i = 0; i < 257; i++)
                      {
                          var relative = $"{i:D4}.txt";
                          var path = Path.Combine(_paths.Payloads, relative);
                          await File.WriteAllTextAsync(path, "owned payload");
                          if (i < 256) File.SetAttributes(path, FileAttributes.ReadOnly);
                          await using var command = connection.CreateCommand();
                          command.Transaction = (SqliteTransaction)transaction;
                          command.CommandText = "INSERT INTO payload_delete_outbox(id,relative_path,created_at_utc,attempt_count) VALUES(@id,@path,@time,0)";
                          command.Parameters.AddWithValue("@id", i.ToString("D4"));
                          command.Parameters.AddWithValue("@path", relative);
                          command.Parameters.AddWithValue("@time", DateTimeOffset.UtcNow.AddMinutes(i).ToString("O"));
                          await command.ExecuteNonQueryAsync();
                      }
                      await transaction.CommitAsync();
                  }
                  var reconciler = new OwnedPayloadReconciler(_paths, _repository, NullLogger<OwnedPayloadReconciler>.Instance);
                  var coordinator = new PayloadCleanupCoordinator(_paths, _repository, new FilePayloadStore(_paths), reconciler, NullLogger<PayloadCleanupCoordinator>.Instance);
                  var first = await coordinator.DrainAsync();
                  var second = await coordinator.DrainAsync();
                  TestContext.WriteLine($"completed first={first}; second={second}; newerExists={File.Exists(Path.Combine(_paths.Payloads, "0256.txt"))}");
                  Assert.IsFalse(File.Exists(Path.Combine(_paths.Payloads, "0256.txt")), "Repeated drains must make fair progress past permanently failing oldest entries.");
              }
          }
          '@ | Set-Content tests/DropSpace.Infrastructure.Tests/Beta25AuditRegressionTests.cs -Encoding utf8
          Copy-Item tests/DropSpace.Infrastructure.Tests/Beta25AuditRegressionTests.cs audit-output/
      - name: Execute targeted regression assertions
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~Beta25AuditRegressionTests --logger 'trx;LogFileName=targeted-audit.trx' *> audit-output/targeted-tests.log
          $code = $LASTEXITCODE
          Get-Content audit-output/targeted-tests.log
          "targeted=$code" | Add-Content audit-output/exit-codes.txt
          exit $code
      - name: Preserve audit-only changes
        if: always()
        shell: pwsh
        run: git status --short | Set-Content audit-output/final-worktree-status.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: beta25-audit-targeted-validation
          path: |
            audit-output/
            **/TestResults/targeted-audit.trx
          if-no-files-found: error
          retention-days: 7
