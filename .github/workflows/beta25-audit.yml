name: Beta25 Isolated Engineering Audit
on:
  push:
    branches: [audit/beta25-20260921-engineering]
    paths: [.github/workflows/beta25-audit.yml]
permissions:
  contents: read
jobs:
  clean-installer-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 53dff85de5b4277f37783fdb3f3f1b4506e028f9
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Verify isolated profile and source
        shell: pwsh
        run: |
          New-Item audit-output -ItemType Directory -Force | Out-Null
          git rev-parse HEAD | Set-Content audit-output/audited-commit.txt
          $dataRoot = Join-Path $env:LOCALAPPDATA DropSpace
          if (Test-Path $dataRoot) { throw 'Pristine profile required; do not delete pre-existing data.' }
          'initial-dropSpace-profile=absent' | Set-Content audit-output/profile-precondition.txt
          ./scripts/Generate-BrandAssets.ps1 -Verify
          ./scripts/Generate-BrandAssets.ps1
      - name: Build original portable and installer payloads
        shell: pwsh
        run: |
          ./scripts/Build-PortableExe.ps1 *> audit-output/portable-build.log
          if ($LASTEXITCODE) { Get-Content audit-output/portable-build.log; exit $LASTEXITCODE }
          ./scripts/Build-Installer.ps1 *> audit-output/installer-build.log
          $code = $LASTEXITCODE
          'build=' + $code | Set-Content audit-output/exit-codes.txt
          Get-Content audit-output/installer-build.log
          exit $code
      - name: Exercise installation upgrade restart and both uninstall modes
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            ./scripts/Test-InstallerLifecycle.ps1 -AllowUserDataMutation *> audit-output/installer-lifecycle.log
            'installer-lifecycle=0' | Add-Content audit-output/exit-codes.txt
          } catch {
            $_ | Out-String | Add-Content audit-output/installer-lifecycle.log
            'installer-lifecycle=1' | Add-Content audit-output/exit-codes.txt
            throw
          } finally { Get-Content audit-output/installer-lifecycle.log }
      - name: Preserve status
        if: always()
        shell: pwsh
        run: git status --short | Set-Content audit-output/final-worktree-status.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: beta25-audit-pristine-installer
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
