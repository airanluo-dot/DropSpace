name: Apply architecture audit fixes batch 3b

on:
  push:
    branches: ["audit-fix/full-architecture-hardening"]
    paths:
      - scripts/apply-audit-fixes-batch3b.py
      - .github/workflows/apply-audit-fixes-batch3b.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-batch3b-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit-fix/full-architecture-hardening
          fetch-depth: 0
      - name: Apply asserted UI correction
        shell: pwsh
        run: python scripts/apply-audit-fixes-batch3b.py
      - name: Validate patch shape
        shell: pwsh
        run: git diff --check
      - name: Commit correction
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DropSpace.App/ViewModels/MainViewModel.cs
          git commit -m "Keep incremental projection updates on UI context [audit-batch3b-applied]"
          git push origin HEAD:audit-fix/full-architecture-hardening
