name: CUDA component contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cuda-component-contracts.yml'
      - 'scripts/cuda_runtime_contract.py'
      - 'scripts/package-cuda-runtime.py'
      - 'scripts/stage-reviewed-cuda-metadata.py'
      - 'scripts/Test-CudaBuildBinding.ps1'
      - 'scripts/test-ai-release-approval*.mjs'
      - 'src/DropSpace.Infrastructure/Lyrics/CudaLyricsRuntimePackage.cs'
      - 'website/_source/scripts/verify-published-release*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-contracts:
    name: Verify CUDA package metadata
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bind approved CUDA component metadata without test fixtures
        shell: pwsh
        run: |
          python scripts/stage-reviewed-cuda-metadata.py --app-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed independent CUDA metadata staging failed.' }
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          ./scripts/Test-CudaBuildBinding.ps1 -MetadataDirectory artifacts/cuda-runtime/win-x64 -InformationalVersion "$($version.Substring(1))+$env:GITHUB_SHA"
