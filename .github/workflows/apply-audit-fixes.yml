name: Apply architecture audit fixes

on:
  push:
    branches:
      - audit-fix/full-architecture-hardening
    paths:
      - scripts/apply-audit-fixes.py
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-architecture-audit-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fixes-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: audit-fix/full-architecture-hardening
          fetch-depth: 0

      - name: Apply asserted repository patches
        id: patches
        shell: bash
        run: |
          set +e
          python scripts/apply-audit-fixes.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "Patch applicator stopped at the first ambiguous assertion; successfully asserted changes before that point will still be committed for independent CI validation."
          fi

      - name: Commit generated hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve architecture audit findings batch 1 [audit-fixes-applied]"
          git push origin HEAD:audit-fix/full-architecture-hardening
