name: Explicit Release Dispatch Bridge

on:
  create:
  # Allow a failed publication dispatch to be retried by advancing the
  # exact-name publication branch to the new main commit.
  # A new branch also emits push(created=true); create already handles it.
  push:
    branches:
      - 'publish/**'

permissions: {}

jobs:
  dispatch:
    name: Dispatch validated release publication
    if: >-
      github.ref_type == 'branch' &&
      startsWith(github.ref_name, 'publish/') &&
      github.actor == github.repository_owner &&
      (github.event_name == 'create' ||
       (github.event_name == 'push' && github.event.created != true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate immutable publication request
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < RELEASE_VERSION)"
          expected_ref="publish/${tag}"
          main_sha="$(git rev-parse HEAD)"

          if [[ "${GITHUB_REF_NAME}" != "${expected_ref}" ]]; then
            echo "Expected publication branch ${expected_ref}, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          if [[ "${GITHUB_SHA}" != "${main_sha}" ]]; then
            echo "Publication branch must point exactly at current main (${main_sha}); got ${GITHUB_SHA}." >&2
            exit 1
          fi

          echo "Validated explicit publication request for ${tag} at ${main_sha}."

      - name: Dispatch canonical release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref main -f publish=true -f expected_commit="${GITHUB_SHA}"
