name: Deploy official website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published, edited, released, prereleased]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release-link:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BODY: ${{ github.event.release.body }}
      RELEASE_ID: ${{ github.event.release.id }}
      WEBSITE_URL: https://airanluo-dot.github.io/DropSpace/
    steps:
      - name: Add the official website to Release notes
        shell: bash
        run: |
          if [[ "$RELEASE_BODY" == *"$WEBSITE_URL"* ]]; then
            exit 0
          fi
          updated_body="${RELEASE_BODY}"$'\n\n'"Official website: ${WEBSITE_URL}"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f body="$updated_body"

  build:
    runs-on: ubuntu-latest
    outputs:
      stable_tag: ${{ steps.release_metadata.outputs.stable_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/_source/package-lock.json
      - name: Install website dependencies
        working-directory: website/_source
        run: npm ci
      - name: Sync GitHub Releases
        if: github.event_name != 'pull_request'
        working-directory: website/_source
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync-releases
      - name: Capture synchronized Stable tag
        id: release_metadata
        working-directory: website/_source
        shell: bash
        run: node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('data/releases.json','utf8')); console.log('stable_tag='+data.stable.tag)" >> "$GITHUB_OUTPUT"
      - name: Build and test static output
        working-directory: website/_source
        run: npm test
      - name: Test language routes in a real browser
        working-directory: website/_source
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload atomic Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/_source/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify live Release and website metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          expected_tag="$(tr -d '\r\n' < RELEASE_VERSION)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # A version-promotion push can deploy before its Windows Release is
            # published. Verify the Stable metadata that this build actually
            # synchronized; the post-publication dispatch verifies RELEASE_VERSION.
            expected_tag="${{ needs.build.outputs.stable_tag }}"
            verification_mode="live"
          else
            verification_mode="release"
          fi
          node website/_source/scripts/verify-published-release.mjs "$expected_tag" 180 "$verification_mode"
