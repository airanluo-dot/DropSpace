name: Deploy official website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "localization/**"
      - "branding/text-gradients.json"
      - "scripts/check-localization.mjs"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "localization/**"
      - "branding/text-gradients.json"
      - "scripts/check-localization.mjs"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:
permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Independent module/component releases do not publish or verify an App version.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'macos-v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      stable_tag: ${{ steps.release_metadata.outputs.stable_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/_source/package-lock.json
      - name: Install website dependencies
        working-directory: website/_source
        run: npm ci
      - name: Sync GitHub Releases
        if: github.event_name != 'pull_request'
        working-directory: website/_source
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync-releases
      - name: Capture synchronized Stable tag
        id: release_metadata
        working-directory: website/_source
        shell: bash
        run: node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('data/releases.json','utf8')); console.log('stable_tag='+data.stable.tag)" >> "$GITHUB_OUTPUT"
      - name: Build static website output
        working-directory: website/_source
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload atomic Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/_source/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    needs: [build, deploy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify live Release and website metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          expected_tag="$(tr -d '\r\n' < RELEASE_VERSION)"
          if [[ "$PUBLISHED_TAG" == macos-v* ]]; then
            node website/_source/scripts/verify-published-macos.mjs "$PUBLISHED_TAG"
            expected_tag="${{ needs.build.outputs.stable_tag }}"
            node website/_source/scripts/verify-published-release.mjs "$expected_tag" 180 live
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # A version-promotion push can deploy before its Windows Release is
            # published. Verify the Stable metadata that this build actually
            # synchronized; the post-publication dispatch verifies RELEASE_VERSION.
            expected_tag="${{ needs.build.outputs.stable_tag }}"
            verification_mode="live"
          else
            verification_mode="release"
          fi
          node website/_source/scripts/verify-published-release.mjs "$expected_tag" 180 "$verification_mode"
