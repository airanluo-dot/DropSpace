name: Apply architecture audit fixes batch 4

on:
  push:
    branches: ["audit-fix/full-architecture-hardening"]
    paths:
      - scripts/apply-audit-fixes-batch4.py
      - .github/workflows/apply-audit-fixes-batch4.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-batch4-applied]') }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit-fix/full-architecture-hardening
          fetch-depth: 0
      - name: Apply asserted ViewModel extraction
        shell: pwsh
        run: python scripts/apply-audit-fixes-batch4.py
      - name: Validate patch shape
        shell: pwsh
        run: git diff --check
      - name: Commit extracted orchestration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DropSpace.App/ViewModels/MainViewModel.cs src/DropSpace.App/App.xaml.cs
          git commit -m "Delegate settings application orchestration [audit-batch4-applied]"
          git push origin HEAD:audit-fix/full-architecture-hardening
