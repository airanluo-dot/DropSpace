name: Apply Preview.18 versioning

on:
  push:
    branches: ["audit-fix/full-architecture-hardening"]
    paths:
      - scripts/apply-preview18-versioning.py
      - .github/workflows/apply-preview18-versioning.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preview18-versioned]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit-fix/full-architecture-hardening
          fetch-depth: 0

      - name: Apply asserted Preview.18 versioning
        run: python scripts/apply-preview18-versioning.py

      - name: Validate patch shape
        run: |
          git diff --check
          git diff -- RELEASE_VERSION README.md ROADMAP.md

      - name: Commit versioned release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_VERSION README.md ROADMAP.md
          git commit -m "Version architecture hardening as Preview.18 [preview18-versioned]"
          git push origin HEAD:audit-fix/full-architecture-hardening
