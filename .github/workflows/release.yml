name: DropSpace Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated release from main
        required: true
        default: false
        type: boolean

      expected_commit:
        description: Exact reviewed main commit required for publication
        required: false
        type: string

      capture_ai_evidence:
        description: Capture actual plain-Hy production evidence without publishing
        required: false
        default: false
        type: boolean

concurrency:
  # Validation must never occupy the publication queue. Publication remains
  # serialized and non-cancellable within its own lane.
  group: dropspace-release-${{ github.ref }}-${{ inputs.publish == true && 'publish' || 'validation' }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Build and validate release bundle
    # The release lane uses the named Windows Server 2025 image so a moving
    # windows-latest image cannot silently change produced bytes.
    runs-on: windows-2025
    # Final evidence adds a separately bounded 30-minute capture to normal validation.
    timeout-minutes: ${{ (inputs.capture_ai_evidence == true && inputs.publish != true) && 110 || 80 }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
      signing_required: ${{ steps.version.outputs.signing_required }}
      ai_runtime_manifest_sha256: ${{ steps.ai-runtime-diagnostic-manifest.outputs.sha256 }}
      ai_semantic_approved: ${{ steps.ai-release-approval.outputs.semantic_approved }}
      ai_publication_authorized: ${{ steps.ai-release-approval.outputs.authorized }}
      ai_publication_mode: ${{ steps.ai-release-approval.outputs.mode }}

    steps:
      - name: Check out clean source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Locate successful identical-tree CI bundle
        id: ci-promotion
        if: inputs.publish == true && inputs.capture_ai_evidence != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-promotion.mjs find

      - name: Download exact validated CI bundle
        if: steps.ci-promotion.outputs.reuse == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.ci-promotion.outputs.artifact_id }}
          run-id: ${{ steps.ci-promotion.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/release

      - name: Verify and promote unchanged CI bytes
        if: steps.ci-promotion.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-promotion.mjs promote artifacts/release

      - name: Install .NET 10 SDK
        if: steps.ci-promotion.outputs.reuse != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Directory.Packages.props


      - name: Derive Stable or Beta release metadata
        id: version
        shell: pwsh
        run: |
          . ./scripts/ReleaseVersion.ps1
          $info = Assert-DropSpaceNewReleaseVersion ((Get-Content RELEASE_VERSION -Raw).Trim())
          if (-not (Test-Path ".github/release-notes/$($info.Tag).md" -PathType Leaf)) {
            throw "Missing release notes for $($info.Tag)."
          }
          "tag=$($info.Tag)" >> $env:GITHUB_OUTPUT
          "version=$($info.SemanticVersion)" >> $env:GITHUB_OUTPUT
          "channel=$($info.Channel)" >> $env:GITHUB_OUTPUT
          "prerelease=$($info.GitHubPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "make_latest=$($info.MakeLatest.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "signing_required=$($($info.Channel -eq 'Stable').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $info | Format-List | Out-String | Write-Host

      - name: Enforce explicit publication policy
        shell: pwsh
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
          RELEASE_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          AUTOMATION_ACTOR: github-actions[bot]
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ACTUAL_COMMIT: ${{ github.sha }}
        run: |
          if ($env:PUBLISH_REQUESTED -ne "true") {
            exit 0
          }
          . ./scripts/ReleaseVersion.ps1
          Assert-DropSpacePublicationCommit $env:EXPECTED_COMMIT $env:ACTUAL_COMMIT
          if ($env:RELEASE_REF -ne "refs/heads/main") {
            throw "Release publication is only permitted from refs/heads/main."
          }
          if (
            $env:RELEASE_ACTOR -ne $env:REPOSITORY_OWNER -and
            $env:RELEASE_ACTOR -ne $env:AUTOMATION_ACTOR
          ) {
            throw "Release publication is restricted to the repository owner or the trusted publication bridge."
          }

      - name: Test AI semantic release gate regressions
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: node --test scripts/test-ai-release-approval.test.mjs scripts/test-ai-runtime-publication.test.mjs


      - name: Test packaged runtime inspection regressions
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./scripts/Test-AiRuntimePayloadInspector.ps1
          ./scripts/Test-ReviewedAiRuntimeArchive.ps1
          ./scripts/plain-hy-production-evidence/Test-ProductionEvidenceContract.ps1


      - name: Test expanded island scope and fullscreen behavior contracts
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: node --test scripts/test-expanded-island-layout.test.mjs scripts/test-fullscreen-island.test.mjs


      - name: Test private translation helper protocol without model dependencies
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          python -m unittest discover -s tools/ct2-helper -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private translation helper protocol checks failed.' }

      # Pending approval blocks publication, never ordinary PR validation.
      # Only v0.3.1-beta.3 may use its exact recorded owner acceptance without semantic approval.

      - name: Enforce AI publication decision before building
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: node scripts/test-ai-release-approval.mjs

      - name: Validate Stable and Beta release metadata
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseVersion.ps1
          ./scripts/Test-ReleaseConsistency.ps1


      - name: Enforce localization resource policy
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-Localization.ps1


      - name: Test frozen model prompt localization exceptions
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: node --test scripts/test-localization-policy.test.mjs


      - name: Enforce Windows 10/11 compatibility baseline
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-WindowsCompatibility.ps1


      - name: Enforce hardcoding governance
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-HardcodingGovernance.ps1


      - name: Enforce secret hygiene
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-SecretHygiene.ps1


      - name: Verify committed brand assets on clean checkout
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Generate-BrandAssets.ps1 -Verify


      - name: Confirm brand verification did not mutate the checkout
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $status = git status --short --untracked-files=all
          if ($status) { throw "Brand verification mutated the clean checkout:`n$status" }


      - name: Restore locked dependency graph
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: dotnet restore DropSpace.sln -p:Configuration=Release -p:RestoreLockedMode=true


      - name: Build verified offline AI inference runtime
        if: ${{ steps.ci-promotion.outputs.reuse != 'true' && (!(github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
        shell: pwsh
        run: |
          ./scripts/Prepare-VulkanBuildDependencies.ps1 -GitHubActions
          ./scripts/Build-AiLyricsRuntime.ps1


      - name: Record immutable runtime producer identity
        if: ${{ steps.ci-promotion.outputs.reuse != 'true' && (!(github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
        shell: pwsh
        env:
          PRODUCER_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $path = 'artifacts/ai-runtime/win-x64/runtime-manifest.json'
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          $checkout = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Runtime producer checkout mismatch.' }
          $producer = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            workflowPath = '.github/workflows/release.yml'
            runId = [long]$env:GITHUB_RUN_ID
            runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            headCommit = $env:PRODUCER_HEAD_COMMIT
            checkoutCommit = $checkout
          }
          $manifest | Add-Member -NotePropertyName producer -NotePropertyValue $producer
          $json = ($manifest | ConvertTo-Json -Depth 8) -replace "`r`n", "`n"
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $path), $json + "`n", [Text.UTF8Encoding]::new($false))


      - name: Retrieve the exact reviewed runtime
        if: ${{ steps.ci-promotion.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-ReviewedAiRuntime.ps1


      - name: Bind AI publication decision to exact shipping runtime bytes
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        id: ai-release-approval
        shell: pwsh
        run: |
          if ('${{ steps.ci-promotion.outputs.reuse }}' -eq 'true') {
            node scripts/test-ai-release-approval.mjs --release-bundle artifacts/release
          } else {
            node scripts/test-ai-release-approval.mjs --runtime-manifest artifacts/ai-runtime/win-x64/runtime-manifest.json
          }
          if ($LASTEXITCODE -ne 0) { throw 'AI publication decision failed.' }
          if ('${{ steps.ci-promotion.outputs.reuse }}' -ne 'true') { ./scripts/Test-AiLyricsRuntime.ps1 }
          node scripts/test-ai-release-approval.mjs --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'AI publication decision output failed.' }

      # Development-only handoff of this run's verified build. No model weights are uploaded.
      - name: Record candidate diagnostic runtime identity
        if: ${{ steps.ci-promotion.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}
        id: ai-runtime-diagnostic-manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/ai-runtime/win-x64/runtime-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT


      - name: Upload runtime for isolated candidate diagnostics
        if: ${{ steps.ci-promotion.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}
        id: ai-runtime-artifact
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-candidate-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ai-runtime/win-x64/runtime-manifest.json
            artifacts/ai-runtime/win-x64/llama-completion.exe
            artifacts/ai-runtime/win-x64/llama-completion-avx2.exe
            artifacts/ai-runtime/win-x64/llama-tokenize.exe
            artifacts/ai-runtime/win-x64/plain-lyrics-worker.exe
            artifacts/ai-runtime/win-x64/plain-lyrics-worker-avx2.exe
            artifacts/ai-runtime/win-x64/plain-lyrics-worker-vulkan.exe
            artifacts/ai-runtime/win-x64/LICENSE-llama.cpp
          if-no-files-found: error
          retention-days: 60


      - name: Test core policies, versions, and update selection
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: dotnet test tests/DropSpace.Core.Tests/DropSpace.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-release.trx"


      - name: Test persistence, manifests, downloads, and update coordination
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=infrastructure-release.trx"


      - name: Test production evidence harness without native inference
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          dotnet restore scripts/plain-hy-production-evidence/PlainHyProductionEvidence.csproj -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'Production evidence harness locked restore failed.' }
          dotnet run --project scripts/plain-hy-production-evidence/PlainHyProductionEvidence.csproj -c Release --no-restore -- --contract-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Production evidence harness contract tests failed.' }


      - name: Download pinned models for native AI smoke
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Get-AiLyricsSmokeModel.ps1


      - name: Validate native offline inference and cancellation
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~AiLyricsNativeRuntimeSmokeTests --logger "trx;LogFileName=ai-native-runtime.trx"


      - name: Capture final plain-Hy production evidence on both runtime variants
        if: ${{ steps.ci-promotion.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' && inputs.capture_ai_evidence == true && inputs.publish != true) }}
        timeout-minutes: 30
        shell: pwsh
        env:
          RUNTIME_ARTIFACT_ID: ${{ steps.ai-runtime-artifact.outputs.artifact-id }}
          RUNTIME_ARCHIVE_SHA256: ${{ steps.ai-runtime-artifact.outputs.artifact-digest }}
        run: |
          if (-not $env:RUNTIME_ARTIFACT_ID -or -not $env:RUNTIME_ARCHIVE_SHA256) { throw 'The exact licensed runtime artifact must be retained before capture.' }
          $runtime = 'artifacts/ai-runtime/win-x64'
          $output = 'artifacts/plain-hy-production-evidence'
          New-Item $output -ItemType Directory -Force | Out-Null
          $producer = (Get-Content "$runtime/runtime-manifest.json" -Raw | ConvertFrom-Json).producer
          $files = @(Get-ChildItem $runtime -File | ForEach-Object {
            [ordered]@{ path=$_.Name; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); bytes=$_.Length }
          })
          $contract = [ordered]@{
            schemaVersion=1; repository=$producer.repository; workflowPath=$producer.workflowPath
            runId=$producer.runId; runAttempt=$producer.runAttempt; headCommit=$producer.headCommit; checkoutCommit=$producer.checkoutCommit
            artifactId=[long]$env:RUNTIME_ARTIFACT_ID; artifactName="ai-candidate-runtime-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
            archiveSha256=$env:RUNTIME_ARCHIVE_SHA256; files=$files
          }
          $contract | ConvertTo-Json -Depth 8 | Set-Content "$output/runtime-artifact.json" -Encoding utf8
          node scripts/ai-runtime-publication.mjs verify-contract "$output/runtime-artifact.json"
          if ($LASTEXITCODE -ne 0) { throw 'Retained runtime artifact contract is invalid.' }
          foreach ($variant in @('Baseline', 'Avx2')) {
            $name = "production-plain-hy-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-$($variant.ToLowerInvariant())"
            ./scripts/plain-hy-production-evidence/Run-WindowsProductionEvidence.ps1 -RuntimeDirectory $runtime -ModelPath $env:DROPSPACE_AI_SMOKE_MODEL -ModelId hy-mt2-18-q8-plain-beta -Variant $variant -OutputDirectory "$output/$name"
            $captureSucceeded = $?
            $captureExitCode = $LASTEXITCODE
            if (-not $captureSucceeded -or $captureExitCode -ne 0) { throw "Production $variant capture failed; later variants will not be started." }
          }


      - name: Preserve final production evidence including failures
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.capture_ai_evidence == true && inputs.publish != true)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plain-hy-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plain-hy-production-evidence/**
          if-no-files-found: warn
          retention-days: 60


      - name: Install locked Windows App Runtime for native tests
        if: steps.ci-promotion.outputs.reuse != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/Install-TestWindowsAppRuntime.ps1


      - name: Test App policies and native-boundary contracts
        if: steps.ci-promotion.outputs.reuse != 'true'
        timeout-minutes: 10
        run: dotnet test tests/DropSpace.App.Tests/DropSpace.App.Tests.csproj -c Release --no-restore -p:Platform=x64 -p:WindowsAppSdkDeploymentManagerInitialize=false --logger "trx;LogFileName=app-release.trx"


      - name: Build WinUI Release
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: dotnet build src/DropSpace.App/DropSpace.App.csproj -c Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false


      - name: Publish portable self-contained EXE
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Build-PortableExe.ps1


      - name: Build unsigned MSIX
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Build-UnsignedPackage.ps1 -Platform x64 -NoRestore


      - name: Validate MSIX symbol policy
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-MsixSymbolPolicy.ps1 -ArtifactRoot artifacts/msix


      - name: Build external-location identity package
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Build-IdentityPackage.ps1


      - name: Stage application payloads
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/msix -Recurse -File -Filter *.msix | Select-Object -First 1
          if ($null -eq $package) { throw "MSIX build did not produce an .msix file." }
          Copy-Item $package.FullName artifacts/release/DropSpace-x64.msix -Force


      - name: Build pinned Inno Setup installer from final app payload
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1
          Copy-Item artifacts/installer/DropSpaceSetup.exe artifacts/release/DropSpaceSetup.exe -Force


      - name: Reject mismatched executable release identities
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifactVersion.ps1


      - name: Validate generated icon and brand chain
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-BrandAssets.ps1


      - name: Test installer /UPDATE, restart, upgrade, and uninstall lifecycle
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-InstallerLifecycle.ps1 -AllowUserDataMutation -RuntimeInspectionOutput artifacts/runtime-inspection/installer.json


      - name: Smoke test portable EXE (en-US resource context) without public network access
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1 -Language en-US -RuntimeInspectionOutput artifacts/runtime-inspection/portable.json


      - name: Smoke test portable EXE (zh-CN resource context) without public network access
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1 -Language zh-CN


      - name: Inspect runtime bytes inside the final MSIX
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Inspect-AiRuntimePayload.ps1 -MsixPath artifacts/release/DropSpace-x64.msix -OutputPath artifacts/runtime-inspection/msix.json


      - name: Freeze unsigned bytes and generate release metadata
        shell: pwsh
        run: |
          $files = @(
            "artifacts/release/DropSpaceSetup.exe",
            "artifacts/release/DropSpace.exe",
            "artifacts/release/DropSpace-x64.msix"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing release file: $file" }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          ./scripts/New-UpdateManifest.ps1
          ./scripts/Test-UpdateManifest.ps1
          Get-ChildItem artifacts/release | Select-Object Name,Length

      - name: Bind inspected runtime bytes to the unsigned release bundle
        if: steps.ci-promotion.outputs.reuse != 'true'
        run: node scripts/ai-runtime-publication.mjs record-bundle artifacts/release runtime-directory artifacts/ai-runtime/win-x64 artifacts/runtime-inspection/portable.json artifacts/runtime-inspection/msix.json artifacts/runtime-inspection/installer.json


      - name: Verify exact reviewed bytes in the completed unsigned release bundle
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: node scripts/test-ai-release-approval.mjs --release-bundle artifacts/release

      - name: Record release build environment
        if: steps.ci-promotion.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $metadata = [ordered]@{
            schemaVersion = 1
            releaseTag = (Get-Content RELEASE_VERSION -Raw).Trim()
            commit = $env:GITHUB_SHA
            runnerImage = $env:ImageVersion
            runnerOs = $env:ImageOS
            dotnetVersion = (& dotnet --version).Trim()
            dotnetSdks = ((& dotnet --list-sdks) -join "`n")
            msbuild = ((& dotnet msbuild -version) -join "`n")
            windowsSdkBuild = "10.0.26100.0"
            innoSetup = "7.0.2"
            signingEnabled = $false
            signingJob = '${{ steps.version.outputs.signing_required }}'
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content artifacts/release/build-environment.json -Encoding utf8
          Get-Content artifacts/release/build-environment.json


      - name: Upload unsigned validated release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DropSpace-release-unsigned-${{ steps.version.outputs.tag }}
          path: |
            artifacts/release/DropSpaceSetup.exe
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/SHA256SUMS.txt
            artifacts/release/update-manifest.json
            artifacts/release/runtime-publication.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload unsigned identity package for the isolated signing job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DropSpace-identity-unsigned-${{ steps.version.outputs.tag }}
          path: artifacts/identity/DropSpace.Identity.msix
          if-no-files-found: error
          retention-days: 3
      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-test-results-${{ steps.version.outputs.tag }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release build environment record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-build-environment-${{ steps.version.outputs.tag }}
          path: artifacts/release/build-environment.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload release smoke and installer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: artifacts/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

  sign-release:
    name: Sign stable release bundle
    if: >-
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.signing_required == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: validate-release
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.ARTIFACT_SIGNING_ENDPOINT != '' && secrets.ARTIFACT_SIGNING_ACCOUNT != '' && secrets.ARTIFACT_SIGNING_PROFILE != '' }}

    steps:
      - name: Check out clean source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download unsigned validated bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: DropSpace-release-unsigned-${{ needs.validate-release.outputs.tag }}
          path: artifacts/release

      - name: Download unsigned identity package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: DropSpace-identity-unsigned-${{ needs.validate-release.outputs.tag }}
          path: artifacts/identity

      - name: Verify and preserve unsigned runtime publication binding
        shell: pwsh
        run: |
          node scripts/ai-runtime-publication.mjs verify-bundle artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned runtime publication binding failed.' }
          Copy-Item artifacts/release/runtime-publication.json artifacts/unsigned-runtime-publication.json

      - name: Enforce stable signing configuration
        shell: pwsh
        run: |
          if ($env:SIGNING_CONFIGURED -ne "true") {
            throw "Stable signing requires Azure workload identity and the complete Artifact Signing configuration."
          }
          foreach ($path in @(
            "artifacts/release/DropSpace.exe",
            "artifacts/release/DropSpace-x64.msix",
            "artifacts/identity/DropSpace.Identity.msix"
          )) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing signable payload: $path" }
          }

      - name: Sign in to Azure for Artifact Signing
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stage signable application payloads
        shell: pwsh
        run: |
          New-Item artifacts/signing -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/release/DropSpace.exe artifacts/signing/DropSpace.exe -Force
          Copy-Item artifacts/release/DropSpace-x64.msix artifacts/signing/DropSpace-x64.msix -Force
          Copy-Item artifacts/identity/DropSpace.Identity.msix artifacts/signing/DropSpace.Identity.msix -Force

      - name: Sign application and identity payloads
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\signing
          files-folder-filter: exe,msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Restore and validate signed application payloads
        shell: pwsh
        run: |
          Copy-Item artifacts/signing/DropSpace.exe artifacts/release/DropSpace.exe -Force
          Copy-Item artifacts/signing/DropSpace-x64.msix artifacts/release/DropSpace-x64.msix -Force
          Copy-Item artifacts/signing/DropSpace.Identity.msix artifacts/identity/DropSpace.Identity.msix -Force
          foreach ($path in @(
            "artifacts/release/DropSpace.exe",
            "artifacts/release/DropSpace-x64.msix",
            "artifacts/identity/DropSpace.Identity.msix"
          )) {
            if ((Get-AuthenticodeSignature $path).Status -ne "Valid") {
              throw "Artifact Signing did not produce a trusted signature for $path."
            }
          }

      - name: Build installer embedding only the trusted identity package
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1 -IdentityPackage artifacts/identity/DropSpace.Identity.msix
          Copy-Item artifacts/installer/DropSpaceSetup.exe artifacts/release/DropSpaceSetup.exe -Force

      - name: Sign final installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Restore and validate signed installer
        shell: pwsh
        run: |
          Copy-Item artifacts/installer/DropSpaceSetup.exe artifacts/release/DropSpaceSetup.exe -Force
          if ((Get-AuthenticodeSignature artifacts/release/DropSpaceSetup.exe).Status -ne "Valid") {
            throw "Artifact Signing did not produce a trusted installer signature."
          }

      - name: Re-run final signed installer and portable smoke gates
        shell: pwsh
        run: |
          ./scripts/Test-InstallerLifecycle.ps1 -AllowUserDataMutation -RuntimeInspectionOutput artifacts/runtime-inspection/installer.json
          ./scripts/Test-PortableSmoke.ps1 -Language en-US -RuntimeInspectionOutput artifacts/runtime-inspection/portable.json
          ./scripts/Test-PortableSmoke.ps1 -Language zh-CN

      - name: Inspect runtime bytes inside the signed MSIX
        shell: pwsh
        run: ./scripts/Inspect-AiRuntimePayload.ps1 -MsixPath artifacts/release/DropSpace-x64.msix -OutputPath artifacts/runtime-inspection/msix.json

      - name: Freeze signed bytes and generate release metadata
        shell: pwsh
        run: |
          $files = @(
            "artifacts/release/DropSpaceSetup.exe",
            "artifacts/release/DropSpace.exe",
            "artifacts/release/DropSpace-x64.msix"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing signed release file: $file" }
            if ((Get-AuthenticodeSignature $file).Status -ne "Valid") {
              throw "Signed release file is not trusted: $file"
            }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          ./scripts/New-UpdateManifest.ps1
          ./scripts/Test-UpdateManifest.ps1

      - name: Bind inspected runtime bytes to the signed release bundle
        run: node scripts/ai-runtime-publication.mjs record-bundle artifacts/release reference-binding artifacts/unsigned-runtime-publication.json artifacts/runtime-inspection/portable.json artifacts/runtime-inspection/msix.json artifacts/runtime-inspection/installer.json

      - name: Verify exact reviewed bytes in the completed signed release bundle
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: node scripts/test-ai-release-approval.mjs --release-bundle artifacts/release

      - name: Upload signed release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DropSpace-release-signed-${{ needs.validate-release.outputs.tag }}
          path: |
            artifacts/release/DropSpaceSetup.exe
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/SHA256SUMS.txt
            artifacts/release/update-manifest.json
            artifacts/release/runtime-publication.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload signed smoke and installer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release-diagnostics-${{ github.run_id }}
          path: artifacts/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      github.ref == 'refs/heads/main' &&
      (github.actor == github.repository_owner || github.actor == 'github-actions[bot]') &&
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.ai_publication_authorized == 'true' &&
      (needs.validate-release.outputs.signing_required != 'true' || needs.sign-release.result == 'success')
    needs: [validate-release, sign-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download validated release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.validate-release.outputs.signing_required == 'true' && format('DropSpace-release-signed-{0}', needs.validate-release.outputs.tag) || format('DropSpace-release-unsigned-{0}', needs.validate-release.outputs.tag) }}
          path: artifacts/release

      - name: Reject an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.validate-release.outputs.tag }}'
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; publication is immutable and cannot replace it." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; publication is immutable and cannot retarget it." >&2
            exit 1
          fi

      # Recheck immediately before publication, including expiry and evidence hashes.
      - name: Recheck AI publication decision
        run: node scripts/test-ai-release-approval.mjs --release-bundle artifacts/release

      - name: Publish immutable Stable or Beta release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DropSpace ${{ needs.validate-release.outputs.tag }}
          body_path: .github/release-notes/${{ needs.validate-release.outputs.tag }}.md
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          draft: false
          make_latest: ${{ needs.validate-release.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            artifacts/release/DropSpaceSetup.exe
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/SHA256SUMS.txt
            artifacts/release/update-manifest.json

      - name: Refresh official website release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --ref main

      - name: Verify published Release and official website end to end
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node website/_source/scripts/verify-published-release.mjs "${{ needs.validate-release.outputs.tag }}" 1200
