name: Preview Release

on:
  pull_request:
    branches: [main]
    paths:
      - RELEASE_VERSION
      - .github/workflows/release.yml
      - .github/release-notes/**
      - scripts/Build-PortableExe.ps1
      - scripts/Build-UnsignedPackage.ps1
      - scripts/Compile-Win32Resource.ps1
      - scripts/Test-PortableSmoke.ps1
      - src/**
      - tests/**
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
  workflow_dispatch:

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Build and validate release bundle
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.ARTIFACT_SIGNING_ENDPOINT != '' && secrets.ARTIFACT_SIGNING_ACCOUNT != '' && secrets.ARTIFACT_SIGNING_PROFILE != '' }}

    steps:
      - name: Check out clean source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          if ($version -ne "v0.1.0-preview.2") { throw "Unexpected release version: $version" }

      - name: Restore
        run: dotnet restore DropSpace.sln -p:Configuration=Release

      - name: Test core policies and overlay state
        run: dotnet test tests/DropSpace.Core.Tests/DropSpace.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-release.trx"

      - name: Test persistence and storage
        run: dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=infrastructure-release.trx"

      - name: Build WinUI Release
        run: dotnet build src/DropSpace.App/DropSpace.App.csproj -c Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false

      - name: Publish portable self-contained EXE
        shell: pwsh
        run: ./scripts/Build-PortableExe.ps1

      - name: Smoke test portable EXE
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1

      - name: Build unsigned MSIX
        shell: pwsh
        run: ./scripts/Build-UnsignedPackage.ps1 -Platform x64 -NoRestore

      - name: Stage release files
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/msix -Recurse -File -Filter *.msix | Select-Object -First 1
          if ($null -eq $package) { throw "MSIX build did not produce an .msix file." }
          Copy-Item $package.FullName artifacts/release/DropSpace-x64.msix -Force

      - name: Sign in to Azure for Artifact Signing
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign release files with Microsoft Artifact Signing
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\release
          files-folder-filter: exe,msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and generate SHA-256 manifest
        shell: pwsh
        run: |
          $files = @(
            "artifacts/release/DropSpace.exe",
            "artifacts/release/DropSpace-x64.msix"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing release file: $file" }
            $signature = Get-AuthenticodeSignature $file
            if ($env:SIGNING_ENABLED -eq "true" -and $signature.Status -ne "Valid") {
              throw "Artifact Signing was enabled but $file is not validly signed: $($signature.Status)"
            }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem artifacts/release | Select-Object Name,Length
          Get-Content artifacts/release/SHA256SUMS.txt

      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: DropSpace-v0.1.0-preview.2
          path: |
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Preview Release
    if: github.event_name != 'pull_request'
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Download validated release bundle
        uses: actions/download-artifact@v4
        with:
          name: DropSpace-v0.1.0-preview.2
          path: artifacts/release

      - name: Create GitHub Preview Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview.2
          target_commitish: ${{ github.sha }}
          name: DropSpace v0.1.0-preview.2
          body_path: .github/release-notes/v0.1.0-preview.2.md
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/SHA256SUMS.txt
