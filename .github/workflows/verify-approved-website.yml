name: Verify approved website without publishing
on:
  push:
    branches: [qa/approved-website-check-20261003]
permissions:
  contents: read
concurrency:
  group: approved-website-check-20261003
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 017c8aa4622aac1bf0e6e2fe128ed9655a4eacff
          persist-credentials: false
      - name: Verify exact approved source
        run: |
          test "$(git rev-parse HEAD)" = 017c8aa4622aac1bf0e6e2fe128ed9655a4eacff
          test "$(git rev-parse HEAD:website/_source)" = 56fe559c9a3d8c77f49c7d03316b921613bceba9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/_source/package-lock.json
      - name: Install exact locked dependencies
        working-directory: website/_source
        run: npm ci
      - name: Build and test using committed layout fixture
        working-directory: website/_source
        run: npm test
      - name: Install bilingual fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Test both existing outputs in real Chrome
        working-directory: website/_source
        run: npm run test:browser
      - name: Record source and coverage boundaries
        if: always()
        run: |
          mkdir -p website/_source/test-results
          node -e "require('fs').writeFileSync('website/_source/test-results/source.json',JSON.stringify({sourceCommit:'017c8aa4622aac1bf0e6e2fe128ed9655a4eacff',websiteTree:'56fe559c9a3d8c77f49c7d03316b921613bceba9',releaseData:'committed layout fixture; no new release or production synchronization',publication:false},null,2))"
      - name: Preserve rendered screenshots and test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: approved-website-check-${{ github.run_id }}
          path: website/_source/test-results/**
          if-no-files-found: warn
          retention-days: 7
