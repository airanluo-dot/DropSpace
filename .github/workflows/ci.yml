name: Windows CI

on:
  # Validate each PR revision once; publication promotes an identical-tree bundle.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      compile_only:
        description: Compile Debug App and XAML only; no models, runtime staging, tests, packages, or release evidence
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read

concurrency:
  group: windows-ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.compile_only == true && '-compile-only' || '' }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Determine application build scope
    runs-on: ubuntu-26.04
    outputs:
      maintenance_only: ${{ steps.scope.outputs.maintenance_only }}
      release_version: ${{ steps.scope.outputs.release_version }}
      isolated_beta: ${{ steps.scope.outputs.isolated_beta }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Classify complete maintenance diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {isNextBetaRelease} from './scripts/next-beta-release-validation.mjs';
          const tag=fs.readFileSync('RELEASE_VERSION','utf8').trim();
          const isolatedBeta=isNextBetaRelease(tag);
          let maintenance=false, websiteOnly=false;
          try {
            const base=process.env.BASE_SHA;
            if(process.env.GITHUB_EVENT_NAME!=='pull_request'||!/^[a-f0-9]{40}$/.test(base??''))throw new Error('Full application build required');
            execFileSync('git',['fetch','--no-tags','--depth=1','origin',base]);
            const names=execFileSync('git',['diff','--name-only','-z',base,'HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed=new Set(['.github/workflows/ci.yml','.github/workflows/release.yml','scripts/prepare-corrective-release.mjs','docs/dev/corrective-release-preparation.md','website/_source/scripts/release-contract.mjs','ROADMAP.md','.github/release-notes/v0.3.1-beta.14.md','.github/release-notes/v0.3.1-beta.15.md','docs/dev/beta15-fix-audit.md']);
            websiteOnly=names.length>0&&names.some(n=>n.startsWith('website/'))&&names.every(n=>n.startsWith('website/')||n==='.github/workflows/ci.yml');
            maintenance=websiteOnly||(names.length>0&&names.every(n=>allowed.has(n)));
            // Exact corrective Betas require complete App-input comparison and immutable asset binding.
            if(!websiteOnly&&(isolatedBeta||['v0.3.1-beta.15','v0.3.1-beta.16'].includes(tag)))maintenance=false;
          } catch(e) { maintenance=false; websiteOnly=false; console.log(e.message); }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`maintenance_only=${maintenance}\nrelease_version=${tag}\nisolated_beta=${isolatedBeta}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,websiteOnly?'Website-only changes: no application binaries built, no application test pass claimed.\n':maintenance?'Workflow maintenance only: no application binaries built, no functional test pass claimed.\n':'Application or unknown inputs changed: Windows producer required.\n');
          JS
  produce-windows:
    name: Legacy Windows producer
    # GitHub requires contents:write even to read unpublished draft assets.
    # The candidate step only reads the pinned draft and verifies immutable bytes.
    permissions:
      contents: write
      actions: read
    needs: change-scope
    if: (github.event_name != 'workflow_dispatch' || inputs.compile_only != true) && needs.change-scope.outputs.maintenance_only != 'true' && needs.change-scope.outputs.isolated_beta != 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      portable_artifact_id: ${{ steps.portable-artifact.outputs.artifact-id }}
      release_parts_artifact_id: ${{ steps.release-parts.outputs.artifact-id }}
      handoff_sha256: ${{ steps.portable-handoff.outputs.handoff_sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify exact already-built Beta11 candidate for PR publication
        id: reviewed-beta11
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content RELEASE_VERSION -Raw).Trim() -cne 'v0.3.1-beta.11') { exit 0 }
          $source = '3e094dc35999372187bf6ecebe738f8700dc7ad6'
          git fetch --no-tags origin $source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve actual Beta11 build source.' }
          $changed = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare application inputs.' }
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/ci.yml') { exit 0 }
          $run = gh api repos/airanluo-dot/DropSpace/actions/runs/37311548061 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read actual successful producer.' }
          if ($run.head_sha -cne $source -or $run.run_attempt -ne 1 -or $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.event -cne 'workflow_dispatch' -or $run.path -cne '.github/workflows/ci.yml' -or $run.repository.full_name -cne 'airanluo-dot/DropSpace' -or $run.head_repository.full_name -cne 'airanluo-dot/DropSpace') { throw 'Producer identity mismatch.' }
          $artifact = gh api repos/airanluo-dot/DropSpace/actions/artifacts/11345858067 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read promotion artifact identity.' }
          if ($artifact.expired -or $artifact.name -cne 'dropspace-release-promotion-37311548061-1' -or $artifact.digest -cne 'sha256:d42e289b188d98f9fed22513596f26f2cd03b02bd942924dd78a4bdd21d8b7f0' -or $artifact.size_in_bytes -ne 282549634) { throw 'Promotion artifact identity mismatch.' }
          gh run download 37311548061 --repo airanluo-dot/DropSpace --name dropspace-release-promotion-37311548061-1 --dir artifacts/reviewed-beta11
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve actual built packages.' }
          $directory = 'artifacts/reviewed-beta11'
          $receiptPath = Join-Path $directory 'ci-release-receipt.json'
          if ((Get-FileHash $receiptPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne '81860f6ee6cc0af7e6cf59c9ecf1a7dd1b86c8c2021fed4ebf7c877074e9ffc6') { throw 'Pinned producer receipt changed.' }
          $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
          $sourceTree = (git rev-parse "$source^{tree}").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve actual producer tree.' }
          if ($receipt.sourceCommit -cne $source -or $receipt.sourceTree -cne $sourceTree -or $receipt.runId -ne 37311548061 -or $receipt.runAttempt -ne 1 -or $receipt.repository -cne 'airanluo-dot/DropSpace' -or $receipt.releaseVersion -cne 'v0.3.1-beta.11') { throw 'Producer receipt does not bind this candidate.' }
          $expectedNames = @('DropSpace.exe','DropSpaceSetup.exe','DropSpace-x64.msix','DropSpace.Identity.msix','runtime-publication.json')
          if (@($receipt.files.PSObject.Properties).Count -ne $expectedNames.Count -or @(Get-ChildItem $directory -File).Count -ne 6) { throw 'Unexpected producer payload list.' }
          foreach ($name in $expectedNames) {
            $identity = $receipt.files.$name
            $file = Join-Path $directory $name
            if ((Get-Item $file).Length -ne $identity.bytes -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256) { throw "Actual built package changed: $name" }
          }
          $binding = Get-Content (Join-Path $directory 'runtime-publication.json') -Raw | ConvertFrom-Json
          if ($binding.sourceCommit -cne $source -or $binding.installer.kind -cne 'installer-build-input' -or $binding.installer.verificationScope -cne 'compiler-input-bytes-only; installer not executed; tests waived') { throw 'Incorrect package provenance or test claim.' }
          'reuse=true' >> $env:GITHUB_OUTPUT
          "Verified real Windows producer 37311548061/1 and all immutable package bytes. Actual build source: $source; application inputs are unchanged (only CI routing differs). No compilation, application startup, installation, model request or tests repeated." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify exact locally built Beta12 candidate for PR publication
        id: reviewed-beta12
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content RELEASE_VERSION -Raw).Trim() -cne 'v0.3.1-beta.12') { exit 0 }
          $source = 'b1a40a9f699f7104c4fc8e9ff87a40d4ae02445b'
          git fetch --no-tags origin $source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve actual Beta12 build source.' }
          $changed = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare application inputs.' }
          $allowed = @('.github/workflows/ci.yml', '.github/workflows/deploy-website.yml', 'website/_source/scripts/verify-published-release.mjs')
          if ($changed.Count -eq 0 -or @($changed | Where-Object { $_ -cnotin $allowed }).Count -gt 0) { exit 0 }
          $release = gh api repos/airanluo-dot/DropSpace/releases/404007924 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the owner-authorized Beta12 candidate.' }
          if ($release.tag_name -cne 'v0.3.1-beta.12' -or $release.target_commitish -cne $source -or -not $release.prerelease) { throw 'Candidate source or channel mismatch.' }
          $expected = @'
          [
            {"name":"DropSpace.exe","bytes":356196112,"sha256":"bdb88959f60bcee18b6192138392eccfa7685257f2cb57c0e36e471558fe2f03"},
            {"name":"DropSpaceSetup.exe","bytes":82339539,"sha256":"30b371d1dee67b9a9ddb0d32c9c355f8cc3060277d0d463746a8ec9a8a85a910"},
            {"name":"DropSpace-x64.msix","bytes":63456659,"sha256":"f4850cae73df9ee90f66799ded3b851ce43ef9989fa6dd34a9b74c70cf49a66d"},
            {"name":"DropSpace-CUDA-win-x64-v0.3.1-beta.12.zip","bytes":540873572,"sha256":"79e8deb4f8c35e7c9c94da0efa0752826bafe510fcb1e54da23062f2d6f40a0b"},
            {"name":"runtime-publication.json","bytes":5095,"sha256":"921fbb4f614ff3cc43853d87eedeaf8da2f91d333c47ca9f17b027572bdd8735"},
            {"name":"SHA256SUMS.txt","bytes":542,"sha256":"8c6e74660bd4498400fb503c9d123c39dec7f45ec8ff37bdc8d0f6e48fe07aa6"},
            {"name":"update-manifest.json","bytes":716,"sha256":"909e34eb46b4a59e26a759e7f4307a3a5973ef13c82e4e2f0c736a00cc4ea456"}
          ]
          '@ | ConvertFrom-Json
          if (@($release.assets).Count -ne $expected.Count) { throw 'Unexpected release asset list.' }
          foreach ($identity in $expected) {
            $asset = @($release.assets | Where-Object name -CEQ $identity.name)
            if ($asset.Count -ne 1 -or $asset[0].size -ne $identity.bytes -or $asset[0].digest -cne ('sha256:' + $identity.sha256)) { throw "Uploaded candidate identity mismatch: $($identity.name)" }
          }
          $directory = 'artifacts/reviewed-beta12'
          gh release download v0.3.1-beta.12 --repo airanluo-dot/DropSpace --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve the actual built packages.' }
          if (@(Get-ChildItem $directory -File).Count -ne $expected.Count) { throw 'Unexpected downloaded payload list.' }
          foreach ($identity in $expected) {
            $file = Join-Path $directory $identity.name
            if ((Get-Item $file).Length -ne $identity.bytes -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256) { throw "Actual built package changed: $($identity.name)" }
          }
          $binding = Get-Content (Join-Path $directory 'runtime-publication.json') -Raw | ConvertFrom-Json
          if ($binding.sourceCommit -cne $source -or $binding.installer.kind -cne 'installer-build-input' -or $binding.installer.verificationScope -cne 'compiler-input-bytes-only; installer not executed; tests waived') { throw 'Incorrect package provenance or test claim.' }
          $checkSource = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = $source
            node scripts/test-ai-release-approval.mjs --release-bundle $directory
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed runtime and actual package binding failed.' }
          } finally { $env:GITHUB_SHA = $checkSource }
          'reuse=true' >> $env:GITHUB_OUTPUT
          "Verified all seven actual Beta12 package bytes from the local Release build at $source. Application inputs are unchanged; only CI and website routing differ. The owner authorized local compilation and focused checks, and waived broad regressions. This job verifies artifact identity and runtime binding; no CI compilation, App startup, installation, model request or functional tests are claimed." >> $env:GITHUB_STEP_SUMMARY

