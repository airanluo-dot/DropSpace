          $source = 'f62f8fd93053ed019f97f67fac85e8717a636cb8'
          git fetch --no-tags origin $source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve actual Beta13 build source.' }
          $changed = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare application inputs.' }
          $allowed = @('.github/workflows/ci.yml', 'website/_source/scripts/verify-published-release.mjs')
          if ($changed.Count -eq 0 -or @($changed | Where-Object { $_ -cnotin $allowed }).Count -gt 0) { exit 0 }
          $release = gh api repos/airanluo-dot/DropSpace/releases/404345416 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the owner-authorized Beta13 candidate.' }
          if ($release.tag_name -cne 'v0.3.1-beta.13' -or $release.target_commitish -cne $source -or -not $release.prerelease) { throw 'Candidate source or channel mismatch.' }
          $expected = @'
          [
            {
              "name": "DropSpace-CUDA-win-x64-v0.3.1-beta.13.zip",
              "bytes": 540873572,
              "sha256": "79e8deb4f8c35e7c9c94da0efa0752826bafe510fcb1e54da23062f2d6f40a0b"
            },
            {
              "name": "DropSpace-x64.msix",
              "bytes": 63473916,
              "sha256": "e9a29d8be22fe142a81a2d45d8520cf1b38a004d336a7367c736fd4e16e44378"
            },
