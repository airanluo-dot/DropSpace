name: Windows CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (x64)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore DropSpace.sln -p:Configuration=Release

      - name: Test core policies
        run: dotnet test tests/DropSpace.Core.Tests/DropSpace.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx"

      - name: Test persistence and storage
        run: dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=infrastructure.trx"

      - name: Build WinUI application
        run: dotnet build src/DropSpace.App/DropSpace.App.csproj -c Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false

      - name: Publish portable self-contained EXE
        shell: pwsh
        run: ./scripts/Build-PortableExe.ps1

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: dropspace-portable-win-x64
          path: artifacts/release/DropSpace.exe
          if-no-files-found: error

      - name: Build pinned Inno Setup installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1

      - name: Validate icon and brand asset chain
        shell: pwsh
        run: ./scripts/Test-BrandAssets.ps1

      - name: Test install, in-place upgrade, and both uninstall modes
        shell: pwsh
        run: ./scripts/Test-InstallerLifecycle.ps1 -AllowUserDataMutation

      - name: Smoke test portable EXE
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dropspace-setup-win-x64
          path: artifacts/installer/DropSpaceSetup.exe
          if-no-files-found: error

      - name: Build unsigned MSIX package
        shell: pwsh
        run: ./scripts/Build-UnsignedPackage.ps1 -NoRestore

      - name: Upload unsigned MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: dropspace-msix-unsigned-x64
          path: artifacts/msix/**
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
