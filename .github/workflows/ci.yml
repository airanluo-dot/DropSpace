        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-portable-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/DropSpace.exe
            artifacts/release/ci-portable-handoff.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify portable bytes and producer identity
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' && steps.reviewed-beta15.outputs.reuse != 'true' && steps.reviewed-beta16.outputs.reuse != 'true' }}
        id: portable-verification
        env:
          EXPECTED_HANDOFF_SHA256: ${{ steps.portable-handoff.outputs.handoff_sha256 }}
          PORTABLE_ARTIFACT_ID: ${{ steps.portable-artifact.outputs.artifact-id }}
        run: node scripts/ci-portable-handoff.mjs verify artifacts/release

      - name: Verify portable payload bytes
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' && steps.reviewed-beta15.outputs.reuse != 'true' && steps.reviewed-beta16.outputs.reuse != 'true' }}
        shell: pwsh
        run: ./scripts/Inspect-ReleasePackage.ps1 -Kind Portable

      - name: Stage same-build validated release parts
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' && steps.reviewed-beta15.outputs.reuse != 'true' && steps.reviewed-beta16.outputs.reuse != 'true' }}
        shell: pwsh
        run: Copy-Item artifacts/release-parts/* artifacts/release -Force

      - name: Bind packages and record immutable promotion receipt
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' && steps.reviewed-beta15.outputs.reuse != 'true' && steps.reviewed-beta16.outputs.reuse != 'true' }}
        shell: pwsh
        run: |
          node scripts/ai-runtime-publication.mjs record-bundle artifacts/release reference-binding artifacts/release/runtime-reference.json artifacts/release/portable-inspection.json artifacts/release/msix-inspection.json artifacts/release/installer-inspection.json
          if ($LASTEXITCODE -ne 0) { throw 'CI package binding failed.' }
          node scripts/ci-release-promotion.mjs record artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'CI promotion receipt failed.' }

      - name: Upload verified release promotion bundle
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' && steps.reviewed-beta15.outputs.reuse != 'true' && steps.reviewed-beta16.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-release-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpaceSetup.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/DropSpace.Identity.msix
            artifacts/release/runtime-publication.json
            artifacts/release/ci-release-receipt.json
          if-no-files-found: error
          retention-days: 7

  focused-windows:
    # Compile the application on the PR, then package identical-tree inputs on main.
    name: Isolated Windows producer
    needs: change-scope
    if: (github.event_name != 'workflow_dispatch' || inputs.compile_only != true) && needs.change-scope.outputs.maintenance_only != 'true' && needs.change-scope.outputs.isolated_beta == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Directory.Packages.props
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/_source/package-lock.json
      - name: Install locked localization parser dependency
        run: npm ci --prefix website/_source --ignore-scripts
      - name: Locate successful same-tree merged PR build before final packaging
        if: github.event_name == 'workflow_dispatch'
        id: pr-validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/next-beta-release-validation.mjs find
      - name: Download only that PR validation evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.pr-validation.outputs.artifact_id }}
          run-id: ${{ steps.pr-validation.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/next-beta-pr-validation
      - name: Verify actual PR checkout and compilation-only receipt
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/next-beta-release-validation.mjs verify artifacts/next-beta-pr-validation
      - name: Restore locked dependency graph
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') {
            dotnet restore DropSpace.sln -p:Configuration=Release -p:RestoreLockedMode=true
          } else {
            # The final portable publish is self-contained and uses --no-restore.
            # App.csproj owns win-x64; a global -r would invalidate the RID-free
            # Core/Infrastructure locks. Restore the portable runtime packs here.
            dotnet restore src/DropSpace.App/DropSpace.App.csproj -p:Configuration=Release -p:RestoreLockedMode=true -p:Platform=x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          }
          if ($LASTEXITCODE -ne 0) { throw 'Locked candidate dependency restore failed.' }
      - name: Retrieve exact already-reviewed CPU runtime bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-ReviewedAiRuntime.ps1
      - name: Restore the exact previously bundled language model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: artifacts/lyrics-language/lid.176.bin
          key: dropspace-bundled-language-7e69ec5451bc261cc7844e49e4792a85d7f09c06789ec800fc4a44aec362764e
      - name: Reuse verified language bytes from cache, the reviewed PR build, or the pinned release
        shell: pwsh
        run: ./scripts/Reuse-BundledLyricsLanguageModel.ps1 -PrAssetDirectory "artifacts/next-beta-pr-validation"
      - name: Bind existing independent CUDA component metadata to this checkout
        run: python scripts/stage-reviewed-cuda-metadata.py --app-commit ${{ github.sha }}
      - name: Compile full Windows App and XAML without PR tests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/Build-NextBetaCandidate.ps1 -ValidateOnly
      - name: Retain actual complete build and compilation-only receipt
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-next-beta-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/next-beta-validation/*
          if-no-files-found: error
          retention-days: 14

      - name: Produce final-commit packages with only necessary validation
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Build-NextBetaCandidate.ps1
      - name: Retain final-main packages for unchanged-byte publication
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-release-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpaceSetup.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/DropSpace.Identity.msix
            artifacts/release/runtime-publication.json
            artifacts/release/cuda-runtime-download.json
            artifacts/release/cuda-runtime-manifest.json
            artifacts/release/update-manifest.json
            artifacts/release/SHA256SUMS.txt
            artifacts/release/ci-release-receipt.json
            artifacts/release/localization-publication.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual build and package byte evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-next-beta-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/next-beta-validation/*.txt
            artifacts/next-beta-validation/*.json
            artifacts/runtime-inspection/**
            artifacts/diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  compile-windows:
    name: Debug App and XAML compilation only
    if: github.event_name == 'workflow_dispatch' && inputs.compile_only == true
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce compilation-only scope
        shell: pwsh
        run: |
          foreach ($directory in @('artifacts/ai-runtime', 'artifacts/cuda-runtime', 'artifacts/lyrics-language')) {
            if (Test-Path -LiteralPath $directory) { throw "Compilation-only checkout must not contain staged assets: $directory" }
          }
          New-Item artifacts/windows-compile-only -ItemType Directory -Force | Out-Null
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore only locked App compilation dependencies
        shell: pwsh
        run: |
          dotnet restore src/DropSpace.App/DropSpace.App.csproj -p:Configuration=Debug -p:Platform=x64 -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'Locked Debug App dependency restore failed.' }
      - name: Compile Debug App and XAML without staging or execution
        shell: pwsh
        run: |
          dotnet build src/DropSpace.App/DropSpace.App.csproj -c Debug --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false -bl:artifacts/windows-compile-only/app-build.binlog 2>&1 | Tee-Object artifacts/windows-compile-only/app-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Debug App/XAML compilation failed.' }
      - name: Record nonpublishing compilation evidence
        shell: pwsh
        run: |
          $source = (& git rev-parse HEAD).Trim()
          if ($source -cne $env:GITHUB_SHA) { throw 'Compilation evidence must bind the actual workflow checkout.' }
          $receipt = [ordered]@{
            schemaVersion = 1
            kind = 'windows-debug-app-xaml-compile-only'
            repository = $env:GITHUB_REPOSITORY
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            sourceCommit = $source
            sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
            configuration = 'Debug'
            appXamlBuild = $true
            tests = [ordered]@{ status = 'not-run'; executed = 0 }
            releasePromotionEligible = $false
            buildLogSha256 = (Get-FileHash artifacts/windows-compile-only/app-build.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $receipt | ConvertTo-Json -Depth 4 | Set-Content artifacts/windows-compile-only/compile-receipt.json -Encoding utf8
          Write-Output ('DROPSPACE_COMPILE_RECEIPT=' + ($receipt | ConvertTo-Json -Depth 4 -Compress))
          'Debug App/XAML compilation only. No App execution, functional tests, AI/CUDA/model staging, packages or publication. This artifact cannot qualify Release promotion.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain compilation diagnostics only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-debug-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-compile-only/*
          if-no-files-found: warn
          retention-days: 14

  required-validation:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_only == true && 'Debug App/XAML compile check' || 'Build and test (x64)' }}
    needs: [change-scope, produce-windows, focused-windows, compile-windows]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Require the selected producer outcome
        shell: bash
        env:
          COMPILE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_only == true }}
          COMPILE_RESULT: ${{ needs.compile-windows.result }}
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          MAINTENANCE_ONLY: ${{ needs.change-scope.outputs.maintenance_only }}
          RELEASE_VERSION: ${{ needs.change-scope.outputs.release_version }}
          ISOLATED_BETA: ${{ needs.change-scope.outputs.isolated_beta }}
          FOCUSED_RESULT: ${{ needs.focused-windows.result }}
          LEGACY_RESULT: ${{ needs.produce-windows.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]]
          if [[ "$COMPILE_ONLY" == true ]]; then
            [[ "$COMPILE_RESULT" == success && "$FOCUSED_RESULT" == skipped && "$LEGACY_RESULT" == skipped ]]
            echo 'Debug App/XAML compilation succeeded; zero functional cases and no Release or publication evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$COMPILE_RESULT" == skipped ]]
          if [[ "$MAINTENANCE_ONLY" == true ]]; then
            [[ "$FOCUSED_RESULT" == skipped && "$LEGACY_RESULT" == skipped ]]
            echo 'Maintenance-only source scope: no App build or functional test pass is claimed.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ISOLATED_BETA" == true ]]; then
            [[ "$FOCUSED_RESULT" == success && "$LEGACY_RESULT" == skipped ]]
            echo 'The selected isolated Windows producer succeeded; see its recorded build and validation scope.' >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$LEGACY_RESULT" == success && "$FOCUSED_RESULT" == skipped ]]
            echo 'The selected legacy Windows producer succeeded; see its actual validation results.' >> "$GITHUB_STEP_SUMMARY"
          fi
