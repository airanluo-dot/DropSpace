name: Windows CI

on:
  # Validate each PR revision once; publication promotes an identical-tree bundle.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Determine application build scope
    runs-on: ubuntu-latest
    outputs:
      maintenance_only: ${{ steps.scope.outputs.maintenance_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Classify complete maintenance diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          let maintenance=false;
          try {
            const base=process.env.BASE_SHA;
            if(process.env.GITHUB_EVENT_NAME!=='pull_request'||!/^[a-f0-9]{40}$/.test(base??''))throw new Error('Full application build required');
            execFileSync('git',['fetch','--no-tags','--depth=1','origin',base]);
            const names=execFileSync('git',['diff','--name-only','-z',base,'HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
            const allowed=new Set(['.github/workflows/ci.yml','.github/workflows/release.yml','scripts/prepare-corrective-release.mjs','docs/dev/corrective-release-preparation.md']);
            maintenance=names.length>0&&names.every(n=>allowed.has(n));
          } catch(e) { console.log(e.message); }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`maintenance_only=${maintenance}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,maintenance?'Workflow maintenance only: no application binaries built, no functional test pass claimed.\n':'Application or unknown inputs changed: Windows producer required.\n');
          JS

  produce-windows:
    name: Build and validate shared Windows artifacts
    needs: change-scope
    if: needs.change-scope.outputs.maintenance_only != 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      portable_artifact_id: ${{ steps.portable-artifact.outputs.artifact-id }}
      release_parts_artifact_id: ${{ steps.release-parts.outputs.artifact-id }}
      handoff_sha256: ${{ steps.portable-handoff.outputs.handoff_sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read exact owner test waiver
        shell: pwsh
        run: |
          $waived = (@('v0.3.1-beta.6','v0.3.1-beta.7','v0.3.1-beta.8','v0.3.1-beta.9','v0.3.1-beta.10') -ccontains (Get-Content RELEASE_VERSION -Raw).Trim()).ToString().ToLowerInvariant()
          "OWNER_SKIP_TESTS=$waived" >> $env:GITHUB_ENV
          if ($waived -eq 'true') { 'Owner waived functional tests for this exact release. Only compilation, packaging and artifact identity binding run; skipped tests are not passes.' >> $env:GITHUB_STEP_SUMMARY }

      - name: Verify reusable prior successful checks
        id: prior-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-beta2-retry.mjs

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Verify committed brand assets on clean checkout
        if: steps.prior-checks.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Generate-BrandAssets.ps1 -Verify

      - name: Confirm brand verification did not mutate the checkout
        if: steps.prior-checks.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $status = git status --short --untracked-files=all
          if ($status) { throw "Brand verification mutated the clean checkout:`n$status" }

      - name: Validate Stable and Beta release metadata
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseVersion.ps1
          ./scripts/Test-ReleaseConsistency.ps1
      - name: Enforce localization resource policy
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        shell: pwsh
        run: ./scripts/Test-Localization.ps1

      - name: Test frozen model prompt localization exceptions
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        run: node --test scripts/test-localization-policy.test.mjs

      - name: Enforce Windows 10/11 compatibility baseline
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        shell: pwsh
        run: ./scripts/Test-WindowsCompatibility.ps1

      - name: Enforce hardcoding governance
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        shell: pwsh
        run: ./scripts/Test-HardcodingGovernance.ps1

      - name: Enforce secret hygiene
        if: steps.prior-checks.outputs.reuse != 'true'
        shell: pwsh
        run: ./scripts/Test-SecretHygiene.ps1

      - name: Test CI handoff and workflow contracts
        if: env.OWNER_SKIP_TESTS != 'true'
        run: node --test scripts/ci-portable-handoff.test.mjs scripts/ci-share-worker-scope.test.mjs scripts/test-ci-workflows.test.mjs scripts/test-production-evidence-order.test.mjs scripts/ci-beta2-retry.test.mjs scripts/ci-release-promotion.test.mjs

      - name: Test AI semantic release gate regressions
        if: env.OWNER_SKIP_TESTS != 'true'
        run: node --test scripts/test-ai-release-approval.test.mjs scripts/test-ai-runtime-publication.test.mjs

      - name: Test packaged runtime inspection regressions
        if: env.OWNER_SKIP_TESTS != 'true'
        shell: pwsh
        run: |
          ./scripts/Test-AiRuntimePayloadInspector.ps1
          ./scripts/Test-ReviewedAiRuntimeArchive.ps1
          ./scripts/plain-hy-production-evidence/Test-ProductionEvidenceContract.ps1

      - name: Test expanded island scope and fullscreen behavior contracts
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        run: node --test scripts/test-expanded-island-layout.test.mjs scripts/test-fullscreen-island.test.mjs

      - name: Test private translation helper protocol without model dependencies
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        shell: pwsh
        run: |
          python -m unittest discover -s tools/ct2-helper -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Private translation helper protocol checks failed.' }

      - name: Restore locked dependency graph
        run: dotnet restore DropSpace.sln -p:Configuration=Release -p:RestoreLockedMode=true

      - name: Require exact reviewed native runtime reuse
        id: reviewed-runtime
        shell: pwsh
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {readApprovedRuntimeContract} from './scripts/test-ai-release-approval.mjs'; readApprovedRuntimeContract(process.cwd()); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'reuse=true\n');"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed runtime metadata is invalid; automatic AI engine compilation is disabled.' }

      - name: Retrieve exact reviewed native runtime
        if: steps.reviewed-runtime.outputs.reuse == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-ReviewedAiRuntime.ps1

      - name: Test core policies, SemVer, and channel selection
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        run: dotnet test tests/DropSpace.Core.Tests/DropSpace.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx"

      - name: Test persistence, manifests, streaming downloads, and update coordination
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (steps.prior-checks.outputs.reuse != 'true') }}
        run: dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=infrastructure.trx"

      - name: Test production evidence harness without native inference
        if: env.OWNER_SKIP_TESTS != 'true'
        shell: pwsh
        run: |
          dotnet restore scripts/plain-hy-production-evidence/PlainHyProductionEvidence.csproj -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { throw 'Production evidence harness locked restore failed.' }
          dotnet run --project scripts/plain-hy-production-evidence/PlainHyProductionEvidence.csproj -c Release --no-restore -- --contract-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Production evidence harness contract tests failed.' }

      - name: Install locked Windows App Runtime for native tests
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/Install-TestWindowsAppRuntime.ps1

      - name: Test App policies and native-boundary contracts
        if: env.OWNER_SKIP_TESTS != 'true'
        timeout-minutes: 10
        run: dotnet test tests/DropSpace.App.Tests/DropSpace.App.Tests.csproj -c Release --no-restore -p:Platform=x64 -p:WindowsAppSdkDeploymentManagerInitialize=false --logger "trx;LogFileName=app.trx"

      - name: Build WinUI application
        run: dotnet build src/DropSpace.App/DropSpace.App.csproj -c Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false

      - name: Publish portable self-contained EXE
        id: portable-publish
        shell: pwsh
        run: ./scripts/Build-PortableExe.ps1

      - name: Build pinned Inno Setup installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1

      - name: Validate icon and brand asset chain
        if: env.OWNER_SKIP_TESTS != 'true'
        shell: pwsh
        run: ./scripts/Test-BrandAssets.ps1

      - name: Test install, in-place upgrade, and both uninstall modes
        if: env.OWNER_SKIP_TESTS != 'true'
        shell: pwsh
        run: ./scripts/Test-InstallerLifecycle.ps1 -AllowUserDataMutation -RuntimeInspectionOutput artifacts/runtime-inspection/installer.json

      - name: Bind owner-waived installer payload without lifecycle tests
        if: env.OWNER_SKIP_TESTS == 'true'
        shell: pwsh
        run: ./scripts/Inspect-OwnerWaivedPackages.ps1 -Kind Installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-setup-win-x64
          path: artifacts/installer/DropSpaceSetup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Build unsigned MSIX package
        shell: pwsh
        run: ./scripts/Build-UnsignedPackage.ps1 -NoRestore

      - name: Validate MSIX symbol policy
        if: env.OWNER_SKIP_TESTS != 'true'
        shell: pwsh
        run: ./scripts/Test-MsixSymbolPolicy.ps1 -ArtifactRoot artifacts/msix

      - name: Build and validate external-location identity package
        shell: pwsh
        run: ./scripts/Build-IdentityPackage.ps1

      - name: Upload unsigned MSIX package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-msix-unsigned-x64
          path: artifacts/msix/**
          if-no-files-found: error
          retention-days: 3

      - name: Upload unsigned identity package for signing pipeline
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-identity-unsigned-x64
          path: artifacts/identity/DropSpace.Identity.msix
          if-no-files-found: error
          retention-days: 3

      - name: Stage immutable release parts
        shell: pwsh
        run: |
          New-Item artifacts/release-parts -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/installer/DropSpaceSetup.exe artifacts/release-parts/DropSpaceSetup.exe
          $package = Get-ChildItem artifacts/msix -Recurse -File -Filter *.msix | Select-Object -First 1
          if ($null -eq $package) { throw 'MSIX package missing.' }
          Copy-Item $package.FullName artifacts/release-parts/DropSpace-x64.msix
          Copy-Item artifacts/identity/DropSpace.Identity.msix artifacts/release-parts/DropSpace.Identity.msix
          Copy-Item artifacts/runtime-inspection/installer.json artifacts/release-parts/installer-inspection.json
          ./scripts/Inspect-AiRuntimePayload.ps1 -MsixPath artifacts/release-parts/DropSpace-x64.msix -OutputPath artifacts/release-parts/msix-inspection.json
          node --input-type=module -e "import fs from 'node:fs'; import {directoryInventory} from './scripts/ai-runtime-publication.mjs'; fs.writeFileSync('artifacts/release-parts/runtime-reference.json', JSON.stringify({runtimeFiles:directoryInventory('artifacts/ai-runtime/win-x64')}));"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inventory failed.' }

      - name: Upload this attempt's release parts
        id: release-parts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-release-parts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-parts/*
          if-no-files-found: error
          retention-days: 7

      - name: Record same-run portable handoff
        id: portable-handoff
        run: node scripts/ci-portable-handoff.mjs record artifacts/release

      - name: Upload shared portable EXE
        id: portable-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-portable-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/DropSpace.exe
            artifacts/release/ci-portable-handoff.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-windows
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload shared installer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-windows-producer
          path: artifacts/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

  smoke-portable:
    name: Validate portable startup in both languages
    needs: [change-scope, produce-windows]
    if: ${{ always() && needs.change-scope.outputs.maintenance_only != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Require successful shared producer
        shell: pwsh
        env:
          PRODUCER_RESULT: ${{ needs.produce-windows.result }}
        run: |
          if ($env:PRODUCER_RESULT -cne 'success') {
            throw "Shared Windows producer did not succeed: $env:PRODUCER_RESULT"
          }

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read exact owner test waiver
        shell: pwsh
        run: |
          $waived = (@('v0.3.1-beta.6','v0.3.1-beta.7','v0.3.1-beta.8','v0.3.1-beta.9','v0.3.1-beta.10') -ccontains (Get-Content RELEASE_VERSION -Raw).Trim()).ToString().ToLowerInvariant()
          "OWNER_SKIP_TESTS=$waived" >> $env:GITHUB_ENV
          if ($waived -eq 'true') { 'Owner waived functional tests for this exact release. Only compilation, packaging and artifact identity binding run; skipped tests are not passes.' >> $env:GITHUB_STEP_SUMMARY }

      - name: Download this attempt's shared portable EXE
        id: portable-download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.produce-windows.outputs.portable_artifact_id }}
          path: artifacts/release

      - name: Verify portable bytes and producer identity
        id: portable-verification
        env:
          EXPECTED_HANDOFF_SHA256: ${{ needs.produce-windows.outputs.handoff_sha256 }}
          PORTABLE_ARTIFACT_ID: ${{ needs.produce-windows.outputs.portable_artifact_id }}
        run: node scripts/ci-portable-handoff.mjs verify artifacts/release

      - name: Smoke test portable EXE (en-US resource context)
        if: env.OWNER_SKIP_TESTS != 'true'
        id: smoke-en
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1 -Language en-US -RuntimeInspectionOutput artifacts/release/portable-inspection.json

      - name: Smoke test portable EXE (zh-CN resource context)
        id: smoke-zh
        if: ${{ env.OWNER_SKIP_TESTS != 'true' && (!cancelled() && steps.portable-verification.outcome == 'success') }}
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1 -Language zh-CN

      - name: Bind owner-waived portable payload without smoke tests
        if: env.OWNER_SKIP_TESTS == 'true'
        shell: pwsh
        run: ./scripts/Inspect-OwnerWaivedPackages.ps1 -Kind Portable

      - name: Download same-run validated release parts
        if: success() && (env.OWNER_SKIP_TESTS == 'true' || (steps.smoke-en.outcome == 'success' && steps.smoke-zh.outcome == 'success'))
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.produce-windows.outputs.release_parts_artifact_id }}
          path: artifacts/release

      - name: Bind packages and record immutable promotion receipt
        if: success() && (env.OWNER_SKIP_TESTS == 'true' || (steps.smoke-en.outcome == 'success' && steps.smoke-zh.outcome == 'success'))
        shell: pwsh
        run: |
          node scripts/ai-runtime-publication.mjs record-bundle artifacts/release reference-binding artifacts/release/runtime-reference.json artifacts/release/portable-inspection.json artifacts/release/msix-inspection.json artifacts/release/installer-inspection.json
          if ($LASTEXITCODE -ne 0) { throw 'CI package binding failed.' }
          node scripts/ci-release-promotion.mjs record artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'CI promotion receipt failed.' }

      - name: Upload verified release promotion bundle
        if: success() && (env.OWNER_SKIP_TESTS == 'true' || (steps.smoke-en.outcome == 'success' && steps.smoke-zh.outcome == 'success'))
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-release-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/DropSpace.exe
            artifacts/release/DropSpaceSetup.exe
            artifacts/release/DropSpace-x64.msix
            artifacts/release/DropSpace.Identity.msix
            artifacts/release/runtime-publication.json
            artifacts/release/ci-release-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Install .NET 10 SDK for isolated crash diagnostics
        if: ${{ !cancelled() && (steps.smoke-en.outcome == 'failure' || steps.smoke-zh.outcome == 'failure') && steps.portable-verification.outcome == 'success' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: Collect isolated native crash address evidence
        if: ${{ !cancelled() && (steps.smoke-en.outcome == 'failure' || steps.smoke-zh.outcome == 'failure') && steps.portable-download.outcome == 'success' && steps.portable-verification.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath artifacts/release/DropSpace.exe -PathType Leaf)) {
            throw 'Portable publication succeeded without its required EXE; native crash diagnostics cannot run.'
          }
          New-Item -ItemType Directory -Force artifacts/diagnostics | Out-Null
          $env:DROPSPACE_TEST_DATA_ROOT = Join-Path $env:RUNNER_TEMP ("DropSpace-native-probe-" + [guid]::NewGuid().ToString('N'))
          dotnet run --project tools/NativeCrashProbe/NativeCrashProbe.csproj -c Release -- artifacts/release/DropSpace.exe artifacts/diagnostics/native-address-evidence.json
          Remove-Item Env:DROPSPACE_TEST_DATA_ROOT

      - name: Upload smoke and installer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-windows-locales
          path: artifacts/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

  build-and-test:
    # Preserve the two ruleset contexts without a second Windows execution.
    # These report the combined job's result, not invented per-locale test passes.
    name: Build and test (x64, ${{ matrix.language }})
    needs: [change-scope, produce-windows, smoke-portable]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        language: [en-US, zh-CN]
    steps:
      - name: Reflect the consolidated Windows validation result
        shell: bash
        env:
          PRODUCER_RESULT: ${{ needs.produce-windows.result }}
          SMOKE_RESULT: ${{ needs.smoke-portable.result }}
          MAINTENANCE_ONLY: ${{ needs.change-scope.outputs.maintenance_only }}
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: |
          if [[ "$SCOPE_RESULT" == success && "$MAINTENANCE_ONLY" == true && "$PRODUCER_RESULT" == skipped && "$SMOKE_RESULT" == skipped ]]; then
            echo 'Workflow-only maintenance: no application build or functional test pass claimed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$PRODUCER_RESULT" != success || "$SMOKE_RESULT" != success ]]; then
            echo "Consolidated Windows validation did not succeed: producer=$PRODUCER_RESULT, smoke=$SMOKE_RESULT"
            exit 1
          fi
          echo 'Required jobs succeeded. Consult step outcomes for executed versus owner-waived tests; owner-waived packaging-only mode is not a functional test pass.' >> "$GITHUB_STEP_SUMMARY"

  share-worker:
    name: Test encrypted share worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Read owner worker test waiver
        run: echo "OWNER_SKIP_TESTS=$([[ $(cat RELEASE_VERSION) == v0.3.1-beta.6 || $(cat RELEASE_VERSION) == v0.3.1-beta.7 || $(cat RELEASE_VERSION) == v0.3.1-beta.9 || $(cat RELEASE_VERSION) == v0.3.1-beta.10 ]] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Determine complete share-worker change scope
        id: scope
        run: node scripts/ci-share-worker-scope.mjs

      - name: Syntax-check and test Worker coordinator when applicable
        id: worker-tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && env.OWNER_SKIP_TESTS != 'true' && (steps.scope.outcome != 'success' || steps.scope.outputs.run_worker != 'false') }}
        working-directory: share-worker
        run: |
          node --check src/index.js
          npm test

      - name: Require truthful share-worker outcome
        if: ${{ always() }}
        shell: bash
        env:
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          RUN_WORKER: ${{ steps.scope.outputs.run_worker }}
          COMPLETE_DIFF: ${{ steps.scope.outputs.complete_diff }}
          TEST_RESULT: ${{ steps.worker-tests.outcome }}
        run: |
          if [[ "$OWNER_SKIP_TESTS" == true && "$TEST_RESULT" == skipped ]]; then
            echo 'Worker tests waived by owner for this release; no test pass claimed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$SCOPE_RESULT" != success ]]; then exit 1; fi
          if [[ "$RUN_WORKER" == true && "$TEST_RESULT" == success ]]; then
            echo 'Encrypted share worker tests executed successfully.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RUN_WORKER" == false && "$COMPLETE_DIFF" == true && "$TEST_RESULT" == skipped ]]; then
            echo 'Encrypted share worker tests: not-applicable after complete verified diff. No test pass is claimed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Invalid share-worker outcome: run=$RUN_WORKER, complete=$COMPLETE_DIFF, tests=$TEST_RESULT"
            exit 1
          fi
