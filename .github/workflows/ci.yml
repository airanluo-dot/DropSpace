            },
            {
              "name": "DropSpaceSetup.exe",
              "bytes": 82363954,
              "sha256": "52ff63629966c1072c6a34f82e7b149b3142870478e52a7aae693074ad9c567f"
            },
            {
              "name": "SHA256SUMS.txt",
              "bytes": 722,
              "sha256": "e8fd01dbe143a316851ede5aa6e35ac9053b59cef1685e936bd72a79a9929c06"
            },
            {
              "name": "cuda-runtime-download.json",
              "bytes": 1867,
              "sha256": "04938213a11db0e57c3cf61e9286772cfd3712d9ac0f0d86f4889e1430262392"
            },
            {
              "name": "cuda-runtime-manifest.json",
              "bytes": 1815,
              "sha256": "da8742d806541edf452061eec408f645be704445952a93895bc8e9d6a200215a"
            },
            {
              "name": "runtime-publication.json",
              "bytes": 5095,
              "sha256": "0ba4288a9a7512a249ffbe3be8192120cd69f17f602bbb66952139b5aba23f04"
            },
            {
              "name": "update-manifest.json",
              "bytes": 765,
              "sha256": "af2470230e5c09ae58edb8a1298d38aa8d1888ae36e722ac1d8af4a5f6915b4e"
            }
          ]
          '@ | ConvertFrom-Json
          if (@($release.assets).Count -ne $expected.Count) { throw 'Unexpected release asset list.' }
          foreach ($identity in $expected) {
            $asset = @($release.assets | Where-Object name -CEQ $identity.name)
            if ($asset.Count -ne 1 -or $asset[0].size -ne $identity.bytes -or $asset[0].digest -cne ('sha256:' + $identity.sha256)) { throw "Uploaded candidate identity mismatch: $($identity.name)" }
          }
          $directory = 'artifacts/reviewed-beta14'
          gh release download v0.3.1-beta.14 --repo airanluo-dot/DropSpace --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve the actual built packages.' }
          if (@(Get-ChildItem $directory -File).Count -ne $expected.Count) { throw 'Unexpected downloaded payload list.' }
          foreach ($identity in $expected) {
            $file = Join-Path $directory $identity.name
            if ((Get-Item $file).Length -ne $identity.bytes -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256) { throw "Actual built package changed: $($identity.name)" }
          }
          $binding = Get-Content (Join-Path $directory 'runtime-publication.json') -Raw | ConvertFrom-Json
          if ($binding.sourceCommit -cne $source -or $binding.installer.kind -cne 'installer-build-input' -or $binding.installer.verificationScope -cne 'compiler-input-bytes-only; installer not executed; tests waived') { throw 'Incorrect package provenance or test claim.' }
          $checkSource = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = $source
            node scripts/test-ai-release-approval.mjs --release-bundle $directory
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed runtime and actual package binding failed.' }
          } finally { $env:GITHUB_SHA = $checkSource }
          'reuse=true' >> $env:GITHUB_OUTPUT
          "Verified all nine actual Beta14 package bytes from the local Release build at $source. Application inputs are unchanged; only CI routing and the verification record differ. The owner authorized local compilation and focused checks, and waived broad regressions. This job verifies artifact identity and runtime binding; no CI compilation, App startup, installation, model request or functional tests are claimed." >> $env:GITHUB_STEP_SUMMARY

      - name: Read exact owner test waiver
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' }}
        shell: pwsh
        run: |
          $waived = (@('v0.3.1-beta.6','v0.3.1-beta.7','v0.3.1-beta.8','v0.3.1-beta.9','v0.3.1-beta.10','v0.3.1-beta.11','v0.3.1-beta.15') -ccontains (Get-Content RELEASE_VERSION -Raw).Trim()).ToString().ToLowerInvariant()
          "OWNER_SKIP_TESTS=$waived" >> $env:GITHUB_ENV
          if ($waived -eq 'true') { 'Owner waived functional tests for this exact release. Only compilation, packaging and artifact identity binding run; skipped tests are not passes.' >> $env:GITHUB_STEP_SUMMARY }

      - name: Verify reusable prior successful checks
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' }}
        id: prior-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-beta2-retry.mjs

      - name: Install .NET 10 SDK
        if: ${{ steps.reviewed-beta11.outputs.reuse != 'true' && steps.reviewed-beta12.outputs.reuse != 'true' && steps.reviewed-beta13.outputs.reuse != 'true' && steps.reviewed-beta14.outputs.reuse != 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Verify committed brand assets on clean checkout
