              "bytes": 5095,
              "sha256": "74238350af139c2a4da85595d3a1d90a283aa7969809b78e6837b58374df797a"
            },
            {
              "name": "update-manifest.json",
              "bytes": 708,
              "sha256": "83575235b1cbc9d713ffd8e4a6d76082a8e4afaf5a1b8e92ebdc5c889539bf7b"
            }
          ]
          '@ | ConvertFrom-Json
          if (@($release.assets).Count -ne $expected.Count) { throw 'Unexpected release asset list.' }
          foreach ($identity in $expected) {
            $asset = @($release.assets | Where-Object name -CEQ $identity.name)
            if ($asset.Count -ne 1 -or $asset[0].size -ne $identity.bytes -or $asset[0].digest -cne ('sha256:' + $identity.sha256)) { throw "Uploaded candidate identity mismatch: $($identity.name)" }
          }
          $directory = 'artifacts/reviewed-beta13'
          gh release download v0.3.1-beta.13 --repo airanluo-dot/DropSpace --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve the actual built packages.' }
          if (@(Get-ChildItem $directory -File).Count -ne $expected.Count) { throw 'Unexpected downloaded payload list.' }
          foreach ($identity in $expected) {
            $file = Join-Path $directory $identity.name
            if ((Get-Item $file).Length -ne $identity.bytes -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $identity.sha256) { throw "Actual built package changed: $($identity.name)" }
          }
          $binding = Get-Content (Join-Path $directory 'runtime-publication.json') -Raw | ConvertFrom-Json
          if ($binding.sourceCommit -cne $source -or $binding.installer.kind -cne 'installer-build-input' -or $binding.installer.verificationScope -cne 'compiler-input-bytes-only; installer not executed; tests waived') { throw 'Incorrect package provenance or test claim.' }
          $checkSource = $env:GITHUB_SHA
          try {
            $env:GITHUB_SHA = $source
            node scripts/test-ai-release-approval.mjs --release-bundle $directory
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed runtime and actual package binding failed.' }
          } finally { $env:GITHUB_SHA = $checkSource }
          'reuse=true' >> $env:GITHUB_OUTPUT
          "Verified all nine actual Beta13 package bytes from the local Release build at $source. Application inputs are unchanged; only CI and website routing differ. The owner authorized local compilation and focused checks, and waived broad regressions. This job verifies artifact identity and runtime binding; no CI compilation, App startup, installation, model request or functional tests are claimed." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify exact locally built Beta14 candidate for PR publication
        id: reviewed-beta14
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content RELEASE_VERSION -Raw).Trim() -cne 'v0.3.1-beta.14') { exit 0 }
          $source = 'bf4b97a893476b27d9007aa7ea0a511ae8ac90fe'
          git fetch --no-tags origin $source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve actual Beta14 build source.' }
          $changed = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compare application inputs.' }
          $allowed = @('.github/workflows/ci.yml', 'docs/dev/beta14-implementation.md', '.github/release-notes/v0.3.1-beta.14.md')
          if ($changed.Count -eq 0 -or @($changed | Where-Object { $_ -cnotin $allowed }).Count -gt 0) { exit 0 }
          $release = gh api repos/airanluo-dot/DropSpace/releases/404435682 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the owner-authorized Beta14 candidate.' }
          if ($release.tag_name -cne 'v0.3.1-beta.14' -or $release.target_commitish -cne $source -or -not $release.prerelease) { throw 'Candidate source or channel mismatch.' }
          $expected = @'
          [
            {
              "name": "DropSpace-CUDA-win-x64-v0.3.1-beta.14.zip",
              "bytes": 540873572,
              "sha256": "79e8deb4f8c35e7c9c94da0efa0752826bafe510fcb1e54da23062f2d6f40a0b"
            },
            {
              "name": "DropSpace-x64.msix",
              "bytes": 63492932,
              "sha256": "a6ea83ef5b38bf91004b6891716175b7fde3907cc71964496c5cb54be7158e00"
            },
