name: Windows CI

on:
  push:
    branches: [main, "agent/**"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (x64, ${{ matrix.language }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [en-US, zh-CN]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.100
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Temporary Preview.20 maintenance step: capture the Windows/WPF-generated
      # outputs so the repository can be repaired with the canonical renderer.
      - name: Temporary capture generated brand outputs
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/v0.3.0-preview.20-architecture-remediation'
        shell: pwsh
        run: |
          ./scripts/Generate-BrandAssets.ps1
          New-Item -ItemType Directory -Force artifacts/brand-repair/app, artifacts/brand-repair/docs, artifacts/brand-repair/website | Out-Null
          Copy-Item src/DropSpace.App/Assets/* artifacts/brand-repair/app/ -Force
          Copy-Item branding/generated/docs/* artifacts/brand-repair/docs/ -Force
          Copy-Item website/_source/src/assets/* artifacts/brand-repair/website/ -Force

      - name: Upload temporary generated brand outputs
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/v0.3.0-preview.20-architecture-remediation'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-brand-repair-${{ github.run_id }}-${{ matrix.language }}
          path: artifacts/brand-repair
          if-no-files-found: error
          retention-days: 1

      - name: Verify committed brand assets on clean checkout
        shell: pwsh
        run: ./scripts/Generate-BrandAssets.ps1 -Verify

      - name: Confirm brand verification did not mutate the checkout
        shell: pwsh
        run: |
          $status = git status --short --untracked-files=all
          if ($status) { throw "Brand verification mutated the clean checkout:`n$status" }

      - name: Generate brand assets from canonical masters for build
        shell: pwsh
        run: ./scripts/Generate-BrandAssets.ps1

      - name: Validate Stable and Preview release metadata
        shell: pwsh
        run: |
          ./scripts/Test-ReleaseVersion.ps1
          ./scripts/Test-ReleaseConsistency.ps1
      - name: Enforce localization resource policy
        shell: pwsh
        run: ./scripts/Test-Localization.ps1

      - name: Enforce Windows 10/11 compatibility baseline
        shell: pwsh
        run: ./scripts/Test-WindowsCompatibility.ps1

      - name: Enforce hardcoding governance
        shell: pwsh
        run: ./scripts/Test-HardcodingGovernance.ps1

      - name: Enforce secret hygiene
        shell: pwsh
        run: ./scripts/Test-SecretHygiene.ps1

      - name: Restore locked dependency graph
        run: dotnet restore DropSpace.sln -p:Configuration=Release -p:RestoreLockedMode=true

      - name: Test core policies, SemVer, and channel selection
        run: dotnet test tests/DropSpace.Core.Tests/DropSpace.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx"

      - name: Test persistence, manifests, streaming downloads, and update coordination
        run: dotnet test tests/DropSpace.Infrastructure.Tests/DropSpace.Infrastructure.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=infrastructure.trx"

      - name: Test App policies and native-boundary contracts
        run: dotnet test tests/DropSpace.App.Tests/DropSpace.App.Tests.csproj -c Release --no-restore -p:Platform=x64 -p:WindowsAppSdkDeploymentManagerInitialize=false --logger "trx;LogFileName=app.trx"

      - name: Build WinUI application
        run: dotnet build src/DropSpace.App/DropSpace.App.csproj -c Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:AppxPackageSigningEnabled=false -p:GenerateAppxPackageOnBuild=false

      - name: Publish portable self-contained EXE
        shell: pwsh
        run: ./scripts/Build-PortableExe.ps1

      - name: Upload portable EXE
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-portable-win-x64-${{ matrix.language }}
          path: artifacts/release/DropSpace.exe
          if-no-files-found: error
          retention-days: 3

      - name: Build pinned Inno Setup installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1

      - name: Validate icon and brand asset chain
        shell: pwsh
        run: ./scripts/Test-BrandAssets.ps1

      - name: Test install, in-place upgrade, and both uninstall modes
        shell: pwsh
        run: ./scripts/Test-InstallerLifecycle.ps1 -AllowUserDataMutation

      - name: Smoke test portable EXE (${{ matrix.language }} localized resource context)
        shell: pwsh
        run: ./scripts/Test-PortableSmoke.ps1 -Language ${{ matrix.language }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-setup-win-x64-${{ matrix.language }}
          path: artifacts/installer/DropSpaceSetup.exe
          if-no-files-found: error
          retention-days: 3

      - name: Build unsigned MSIX package
        shell: pwsh
        run: ./scripts/Build-UnsignedPackage.ps1 -NoRestore

      - name: Validate MSIX symbol policy
        shell: pwsh
        run: ./scripts/Test-MsixSymbolPolicy.ps1 -ArtifactRoot artifacts/msix

      - name: Build and validate external-location identity package
        shell: pwsh
        run: ./scripts/Build-IdentityPackage.ps1

      - name: Upload unsigned MSIX package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-msix-unsigned-x64-${{ matrix.language }}
          path: artifacts/msix/**
          if-no-files-found: error
          retention-days: 3

      - name: Upload unsigned identity package for signing pipeline
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dropspace-identity-unsigned-x64-${{ matrix.language }}
          path: artifacts/identity/DropSpace.Identity.msix
          if-no-files-found: error
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-${{ matrix.language }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7

  share-worker:
    name: Test encrypted share worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x

      - name: Syntax-check and test Worker coordinator
        working-directory: share-worker
        run: |
          node --check src/index.js
          npm test
