      - name: Verify exact locally built Beta15 candidate for PR publication
        id: reviewed-beta15
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content RELEASE_VERSION -Raw).Trim() -cne 'v0.3.1-beta.15') { exit 0 }
          $source = '734e0a96366fcffae4d3e8361745e4ba549ebf06'
