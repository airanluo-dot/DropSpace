name: Apply architecture audit fixes batch 2

on:
  push:
    branches:
      - audit-fix/full-architecture-hardening
    paths:
      - scripts/apply-audit-fixes-batch2.py
      - .github/workflows/apply-audit-fixes-batch2.yml

permissions:
  contents: write

concurrency:
  group: apply-architecture-audit-fixes-batch2
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fixes-batch2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: audit-fix/full-architecture-hardening
          fetch-depth: 0

      - name: Apply asserted repository patches
        run: python scripts/apply-audit-fixes-batch2.py

      - name: Keep release governance update for connector-owned commit
        shell: bash
        run: git checkout HEAD -- .github/workflows/release.yml

      - name: Commit generated hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve architecture audit findings batch 2 [audit-fixes-batch2-applied]"
          git push origin HEAD:audit-fix/full-architecture-hardening
